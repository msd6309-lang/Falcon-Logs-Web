<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Falcon Logs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A2124" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Falcon Logs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: single phone column, sticky header, fixed bottom action bar, bottom-sheet forms; log strip as the signature element */
:root{
  --bg:#ECEFEA; --surface:#FFFFFF; --sunk:#F5F7F3; --ink:#16222A; --muted:#5A6870; --line:#D2D9D1;
  --accent:#D9480F; --accent-ink:#FFFFFF; --blue:#1C5A9C; --ok:#2B7A3D; --warn:#B26A00; --bad:#B42318;
  --grav:#C9A46A; --sand:#E9CF76; --silt:#B9BE8E; --clay:#8DA2B4; --org:#6E5843; --fill:#A7A7A1; --rock:#5C646B; --pave:#2F3336; --none:#E2E6E0;
  --display:"sans-serif-condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:Roboto,system-ui,sans-serif;
  --mono:"Roboto Mono","Droid Sans Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111618; --surface:#1A2124; --sunk:#151B1D; --ink:#E5ECE7; --muted:#95A39F; --line:#2D383B;
  --accent:#FF7A3D; --accent-ink:#1A0E06; --blue:#7DB2EA; --ok:#6CC383; --warn:#F2B44C; --bad:#FF8A80;
  --grav:#A88653; --sand:#C7AD57; --silt:#949A6C; --clay:#6F8597; --org:#7E6650; --fill:#7F807B; --rock:#4C545A; --pave:#0B0D0E; --none:#263033;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111618; --surface:#1A2124; --sunk:#151B1D; --ink:#E5ECE7; --muted:#95A39F; --line:#2D383B;
  --accent:#FF7A3D; --accent-ink:#1A0E06; --blue:#7DB2EA; --ok:#6CC383; --warn:#F2B44C; --bad:#FF8A80;
  --grav:#A88653; --sand:#C7AD57; --silt:#949A6C; --clay:#6F8597; --org:#7E6650; --fill:#7F807B; --rock:#4C545A; --pave:#0B0D0E; --none:#263033;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:56px}
.back{border:0;background:none;padding:6px 8px 6px 0;color:var(--blue);font-weight:600;cursor:pointer;white-space:nowrap}
.htitle{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}.pill.ex{color:var(--blue);border-color:currentColor}
main.wrap{padding-block:16px 120px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.meta{color:var(--muted);font-size:14px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.depth{font-family:var(--mono);font-weight:600;font-size:14px;min-width:86px;font-variant-numeric:tabular-nums}
.depth small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.sw{width:14px;align-self:stretch;border-radius:3px;flex:none}
.empty{padding:18px;color:var(--muted);text-align:center;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.blue{color:var(--blue);border-color:var(--blue)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.ghost{border-color:transparent;background:none;color:var(--blue)}
.btn.full{width:100%}
.btn:focus-visible,.chip:focus-visible,.row:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{flex:1 1 160px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{padding-top:10px;display:flex;gap:10px}
.bar .btn{flex:1}
/* boring summary */
.summary{display:grid;grid-template-columns:128px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.strip{position:relative;height:300px;margin-top:14px;display:grid;grid-template-columns:24px 32px 1fr;font-family:var(--mono);font-size:10px;color:var(--muted)}
.ticks,.col,.samps{position:relative}
.ticks span{position:absolute;right:4px;transform:translateY(-50%);font-variant-numeric:tabular-nums}
.col{border:1.5px solid var(--ink);background:var(--none);overflow:hidden}
.col i{position:absolute;left:0;right:0;border-bottom:1px solid var(--ink)}
.col i.fill{background-image:repeating-linear-gradient(45deg,var(--fill) 0 4px,transparent 4px 7px)}
.samps b{position:absolute;left:3px;width:8px;background:var(--ink);border-radius:1px}
.samps em{position:absolute;left:15px;transform:translateY(-50%);font-style:normal;font-family:var(--mono);font-weight:600;font-size:11px;line-height:1;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.samps em.ref{color:var(--accent)}
.samps b.run{background:repeating-linear-gradient(0deg,var(--ink) 0 2px,transparent 2px 5px);outline:1.5px solid var(--ink);outline-offset:-1.5px}
.samps em.rqd{color:var(--blue);font-size:10px}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.o-allu{background-color:#9CCBEA!important}.o-resid{background-color:#D2B48C!important}.o-fill{background-color:#D64541!important}
.o-re{background-color:#F28C28!important}.o-wr{background-color:#C4C7CA!important}.o-cr{background-color:#7D8287!important}
.wrpat{background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACkAAACsCAYAAADmHYWdAAAECElEQVR42u2c0W7dMAxDzcL//8vcyzDgDkksiZSzrs5Lgfbe0EkcWaJOjTEGx/WB3z958bvIwZtzpDXm4surgUUugKoGHq4+Ioab76zOk9JA8KrvrjY7wKqGdPDh9/LJXYNcDcgyWARPguTbXLkbUMSvRFaDgeGxIjrIO1EGJ3v1/B8aCLxt/OtzKAx2BIL5rYbjcbM4hcILw5d5gB1hhkp4ccUzKUwxeHIKA6VyAUx8kQ0D/NCYD4lDJFwwMH9ZWKfTb3cl9FSnFu7iZCYc8CFZrSTFIQ0sHvdqELx5pEgG8kcNFNfopzIByWRjqYHG+eWok7Yctnyyulpg9GfYUL4cDeAU7iazWZBSzsoaX6bp0nlAndxMvDxlDYj1STbmlTSQcCqGWDG6NOTwwQ6NzIqj3KWhaMyGogrmefwRgjj2LJPpYyZWjooQkvXM5Wej5sAQ3V5J4ylhrVrPkQGmNFB8i6MZuxIpOAJGVMbDcTm9lxrzrYRhdxbDwBNBp9PrWrMlDRgSWzXBXWq40zIaPco/50Ghe6Uaq2kNFFtvSOaFWY2Pi5rmrAWmzGhk7ejt3avR7MSyQ2MWCyYmO2qqRsq7ufp71o5Oa1RrnCuLj4Z89FIDRRsPhsAd1kAywFIo3MoaDleWYsa11EBhqXL3vMN2NDbE1rIGXDmfIXAjkvSi0WCSNHY4vXJ+6U4w2qaKatdx9LZJuLOhbrWjq0yQktxiZ1er5Ym4vXAlXD1qMPECqE+jpDGbGJ/h5IhmY33iYiGZsaOzvWsW7OhLDSShYLcdHdKYht5Ols9Ia2TsaBd4nNY44PEBjw94bGyMrh5XxTMqT5UDHh/w+IDHBzw+4HHoBqQKJ5omfVhjJkvQq/VZBY+XGjDQUVnQJK2BF+bXK3iDo6FvAY+xIcOGauxXASSK7WQc8Hg0gMdjA3j8uh3daR3S3WxqhZgOeHzA4+8GHjua8GUNBFsbFKwZWWMGreJqeIjymcwaVkrC0QIez4U4g30ZCAG93G/MuGJK4Gf1/3EOeHzA451gSMc+GIqxysgKlQm2Q6inmWwxlw2rTjv68Rxfow8d25Y5ZeuWFvDYwd1W7ehyL+i/Ao9HcFsyBTwOv9004w4ljQMeu8FjV2BmR0n7LfbB6AaPmXCUD3h8wOMDHh/wWLwDfBv16mYqttrRyqPdZkfLCUU3eIyGuWcHjynug3HA4wMeH/D4gMc/ATy2bi+hgsfdyQgzKwYb98FAJCSp+2BUXI60f44G8NhtR9vAYwdHecDjfx48HhvA4/Kcqd49q0YEClYHGtaAuOxRcObCGj9yH4xsZ/e1fTDsNfyP2AeDRtftVfD42NHjgMcHPD7g8TcGj7tJFYvGbKpNVPD44/O/ADAECLjVIzxBAAAAAElFTkSuQmCC)!important;background-size:100% auto!important;background-repeat:repeat-y!important}
.sw.o-allu,.sw.o-resid,.sw.o-fill,.sw.o-re,.sw.o-wr,.sw.o-cr{outline:1px solid rgba(0,0,0,.35);outline-offset:-1px}
.legend{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12.5px;color:var(--ink);padding-top:2px}
.legend span{display:flex;align-items:center;gap:6px;min-width:0}
.legend i{flex:none;width:16px;height:16px;border-radius:3px;outline:1px solid rgba(0,0,0,.35);outline-offset:-1px;background-size:100% auto}
.frow{display:grid;grid-template-columns:70px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:6px}
.frow input{min-height:40px;padding:6px 10px}
.frow .fd,.frow .fm{font-family:var(--mono);font-size:13px;color:var(--muted)}
.frow.fh{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.dcard .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dcard .v{font-weight:600;overflow-wrap:anywhere}
.dcard .actions{grid-column:1/-1}
.tpair{display:flex;gap:6px}.tpair input{flex:1;min-width:0}.tpair .btn{min-height:46px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:default}
.pill.hrs{text-transform:none;letter-spacing:0;font-family:var(--mono)}
.runrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.runrow:last-child{border-bottom:0}
.runrow .row{flex:1;min-width:0;border-bottom:0}
.tbtn{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-left:1px solid var(--line);background:var(--sunk);color:var(--blue);cursor:pointer;font-weight:600}
.tbtn .ti{font-size:16px;line-height:1}
.tbtn .tt{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
.tbtn small{font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.tbtn.on{background:var(--accent);color:var(--accent-ink)}
.tbtn.on .tt{color:var(--accent-ink)}
.timer b{font-size:22px;color:var(--ink)}
.samps .ncap{position:absolute;left:15px;top:-15px;font-size:10px;letter-spacing:.06em;color:var(--muted)}
.wl{position:absolute;left:24px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--blue);transform:translateY(-100%)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;align-content:start;min-width:0}
.fact .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fact .v{font-family:var(--mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.facts .actions{grid-column:1/-1}
.tabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto}
.tab{flex:1 0 auto;font-size:15px;min-height:42px;border:0;border-radius:7px;background:none;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;padding:0 7px}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tab em{font-style:normal;font-family:var(--mono);font-size:11px;margin-left:3px;color:var(--muted)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,14,16,.5)}
.panel{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding-block:6px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 10px}
.phead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.phead h2{flex:1;font-size:24px}
.sec{margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:1/-1;min-width:0}
.fld.half{grid-column:auto}
.lbl{font-size:14px;font-weight:600}
.lbl i{font-style:normal;font-weight:500;color:var(--muted);font-family:var(--mono);font-size:12px}
.req{font-weight:600;font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.fld small{color:var(--muted);font-size:13px}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:10px 12px;font-size:16px}
input.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{min-height:84px;resize:vertical}
.bad-in{border-color:var(--bad)!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-weight:500;cursor:pointer;font-size:15px}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.chips.quick{margin-top:2px}
.grid>.sec{grid-column:1/-1}
.qchip{min-height:34px;padding:0 10px;border-radius:8px;border:1px dashed var(--line);background:none;color:var(--blue);font-size:14px;cursor:pointer}
.chips.uscs .chip{font-family:var(--mono);font-size:13px;min-width:62px;padding:0 8px}
.blows{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stepper{display:flex;flex-direction:column;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.stepper .cap{font-size:11px;text-align:center;color:var(--muted);padding-top:4px;text-transform:uppercase;letter-spacing:.05em}
.stepper input{border:0;background:none;text-align:center;font-family:var(--mono);font-size:24px;font-weight:600;min-height:44px;padding:0}
.stepper .pm{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.stepper button{min-height:44px;border:0;background:var(--surface);font-size:22px;font-weight:600;cursor:pointer}
.stepper button+button{border-left:1px solid var(--line)}
.calc{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px;border-radius:8px;background:var(--sunk);font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.calc b{color:var(--accent)}
.hint{padding:10px 12px;border-left:3px solid var(--blue);background:var(--sunk);border-radius:0 8px 8px 0;font-size:14px}
.err{color:var(--bad);font-weight:600;font-size:14px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.scard.off{opacity:.55}
.scard h4{margin:10px 0 0;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.shead{display:flex;gap:10px;align-items:flex-start}
.shead .s{color:var(--muted);font-size:13px;margin-top:4px}
.scard input.sin,.scard select.sin{min-height:40px;padding:6px 8px;font-size:15px}
.scard input.big{font-weight:700;font-size:17px}
.scard input[type=checkbox]{width:22px;height:22px;min-height:0;margin:9px 0 0;accent-color:var(--blue);flex:none}
.uns{border-color:var(--warn)!important;background:color-mix(in srgb,var(--warn) 14%,var(--sunk))!important}
.hrow{display:grid;grid-template-columns:22px 124px 1fr;gap:8px;align-items:start}
.hrow .hl{font-size:14px;font-weight:600;padding-top:10px}
.hrow small,.lrow small{grid-column:3;color:var(--muted);font-size:12px;margin-top:-4px}
.srow{display:grid;grid-template-columns:22px 58px 58px 1fr 48px;gap:6px;align-items:start}
.srow .w2s{grid-column:2/-1;display:grid;grid-template-columns:90px 1fr;gap:6px}
.srow.cap{font-size:12px;color:var(--muted);font-weight:600;align-items:end}
.arow{display:grid;grid-template-columns:22px 1fr 1fr;gap:6px;align-items:start}
.arow .w2{grid-column:2/-1}
.wrow{display:grid;grid-template-columns:22px 1fr 70px 70px;gap:6px;align-items:start}
.lrow{border-top:1px solid var(--line);padding-top:8px;display:grid;grid-template-columns:22px 1fr;gap:6px}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.lgrid .w2,.lgrid .prev,.lgrid .raw,.lgrid .swarn{grid-column:1/-1}
.mini{display:block;font-size:11px;font-weight:600;color:var(--muted);margin:0 0 2px 2px}
.lgrid .prev{font-family:var(--mono);font-size:13px}
.lgrid .raw{color:var(--muted);font-size:12px}
.swarn{grid-column:2/-1;color:var(--warn);font-size:13px;font-weight:600}
.swarn:empty{display:none}
.ilist{margin:0;padding-left:18px;color:var(--warn);font-size:13px;font-weight:600}
.ilist:empty{display:none}
.scanimg{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff}
.sfile{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sfile:last-child{border-bottom:0}
.sfile .main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.issues{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.issues li{padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:14px;border-left:3px solid var(--warn)}
.issues li.e{border-left-color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}
.note{color:var(--muted);font-size:13px}
.credit{margin:8px 0 0;text-align:center;color:var(--muted);font-size:13px;letter-spacing:.03em}

function fillIds(b){

}

/* GPS (WGS84) to NC State Plane NAD83 US survey feet, EPSG:2264 (Lambert conformal conic). */
function llToNC(latDeg,lonDeg){
  const r=Math.PI/180,a=6378137,f=1/298.257222101,e=Math.sqrt(2*f-f*f),ft=1200/3937;
  const m=p=>Math.cos(p)/Math.sqrt(1-e*e*Math.sin(p)**2);
  const t=p=>Math.tan(Math.PI/4-p/2)/Math.pow((1-e*Math.sin(p))/(1+e*Math.sin(p)),e/2);
  const p1=(36+10/60)*r,p2=(34+20/60)*r,p0=33.75*r,p=latDeg*r;
  const n=(Math.log(m(p1))-Math.log(m(p2)))/(Math.log(t(p1))-Math.log(t(p2)));
  const F=m(p1)/(n*Math.pow(t(p1),n));
  const rho=a*F*Math.pow(t(p),n),rho0=a*F*Math.pow(t(p0),n),th=n*(lonDeg+79)*r;
  return {E:(609601.22+rho*Math.sin(th))/ft,N:(rho0-rho*Math.cos(th))/ft};
}

/* ---------- upgrade data saved by earlier versions ---------- */
function migrate(){
  Object.values(S.projects).forEach(p=>(p.dailies||[]).forEach(d=>(d.acts||[]).forEach(a=>{a.Start=round15(a.Start);a.Stop=round15(a.Stop)})));
  Object.values(S.borings).forEach(b=>(b.core||[]).forEach(c=>{if(c.Origin==="Non-Crystalline")c.Origin="Non-Crystalline Rock";if(c.Origin==="Crystalline")c.Origin="Crystalline Rock"}));
  Object.values(S.borings).forEach(b=>(b.strata||[]).forEach(x=>{if(x.Consistency){if(!x.Density)x.Density=x.Consistency;x.Consistency=""}}));
  const COLOR_SPLIT=c=>{
    const o={Shade:"",ColorMod:"",Color1:"",ColorConj:"",Color2:""};if(!c)return o;
    let w=String(c).trim();
    const sh=w.match(/^(Light|Dark)\s+/i);if(sh){o.Shade=sh[1][0].toUpperCase()+sh[1].slice(1).toLowerCase();w=w.slice(sh[0].length)}
    const md=w.match(/^(Reddish|Yellowish|Grayish|Mottled)\s+/i);if(md){o.ColorMod=md[1][0].toUpperCase()+md[1].slice(1).toLowerCase();w=w.slice(md[0].length)}
    o.Color1=w;return o;
  };
  Object.values(S.borings).forEach(b=>{
    if(b.deleted||b.v>=2)return;
    if(b.PointType==="Boring"||!b.PointType)b.PointType="SPT";
    if(b.DrillMethod==="Hollow Stem Auger")b.DrillMethod="Hollow Augers";
    (b.samples||[]).forEach(s=>{
      if(isNum(s.RefusalIn)&&!isNum(s.RefusalFt))s.RefusalFt=Math.round(s.RefusalIn/12*10)/10;
      delete s.RefusalIn;
      if(s.Moisture==null){const L2=layerAt(b,s.Depth);s.Moisture=L2&&L2.Moisture||""}
    });
    (b.strata||[]).forEach(x=>{
      if(x.Color!=null&&x.Color1==null){Object.assign(x,COLOR_SPLIT(x.Color));delete x.Color}
      if(x.Modifiers&&x.Remarks1==null){x.Remarks1=x.Modifiers}
      delete x.Modifiers;
      if(x.USCS==="FILL"){x.USCS="";if(/^fill$/i.test(x.GroupName||""))x.GroupName="";if(!x.Geology)x.Geology="Artificial Fill"}
      if(x.USCS==="ROCK"){x.USCS="";if(/^rock$/i.test(x.GroupName||""))x.GroupName=""}
      if(x.Geology==="FILL")x.Geology="Artificial Fill";
      if(!x.descEdited)x.Description=describe(x);
    });
    if(!b.GW0Status&&!b.GW24Status){
      const ws=b.water||[];
      const z=ws.find(w=>w.ReadingTiming==="At Completion")||ws.find(w=>w.ReadingTiming==="During Drilling");
      const d=ws.find(w=>w.ReadingTiming==="24 hr"||w.ReadingTiming==="Later Reading");
      if(z&&isNum(z.Depth)){b.GW0Status="Water";b.GW0Depth=z.Depth}
      if(d&&isNum(d.Depth)){b.GW24Status="Water";b.GW24Depth=d.Depth;b.DateGW=d.Date||""}
      const cv=ws.map(w=>w.CaveInDepth).filter(isNum);if(cv.length&&!isNum(b.CaveDepth))b.CaveDepth=Math.min(...cv);
    }
    if(!b.Termination)b.Termination="Boring Terminated";
    if(!b.InOn)b.InOn="in";
    b.v=2;
  });
}

/* Blow counts. Full 6-inch increments are numbers; a refusal (50 blows in less than 6 in)
   goes in the next slot as "50/0.3" (tenths of a foot), as in the gINT example. */
const hasRef=s=>isNum(s.RefusalFt);
function blowSlots(s){
  const full=[s.Blows1,s.Blows2,s.Blows3,s.Blows4];
  const out=[];for(const v of full){if(isNum(v))out.push(String(v));else break}
  if(hasRef(s)&&out.length<4)out.push((isNum(s.RefBlows)?s.RefBlows:50)+"/"+fmtFt(s.RefusalFt));
  while(out.length<4)out.push("");
  return out;
}
const fmtFt=v=>(Math.round(v*10)/10).toFixed(1);
function blowsText(s){return blowSlots(s).filter(Boolean).join("-")}
function refText(s){return hasRef(s)?(isNum(s.RefBlows)?ncNote(s):"50/"+fmtFt(s.RefusalFt)):""}
/* Penetration length in feet: 0.5 per full increment plus the refusal distance. */
function penFt(s){
  if(s.SampleType&&s.SampleType!=="SS")return isNum(s.Bottom)&&isNum(s.Depth)?Math.round((s.Bottom-s.Depth)*100)/100:"";
  const n=blowSlots(s).filter(v=>v&&v.indexOf("/")<0).length;
  if(!n&&!hasRef(s))return "";
  return Math.round((n*0.5+(hasRef(s)?s.RefusalFt:0))*100)/100;
}
function nVal(s){if(hasRef(s))return"";return isNum(s.Blows2)&&isNum(s.Blows3)?s.Blows2+s.Blows3:""}
/* What the log strip shows beside a sample: N, or the refusal text. */
function nLabel(s){if(s.SampleType&&s.SampleType!=="SS")return"";const n=nVal(s);return n!==""?String(n):refText(s)}
function recPct(s){return isNum(s.Recovery_in)&&isNum(s.DriveLength_in)&&s.DriveLength_in>0?Math.round(s.Recovery_in/s.DriveLength_in*100):""}
function layerAt(b,d){return byDepth(b.strata||[]).find(x=>isNum(x.Depth)&&d>=x.Depth&&(!isNum(x.Bottom)||d<x.Bottom))||null}
const isSurface=x=>!!SURFACE[x.USCS];
const originText=g=>g?(ORIGIN_OUT[g]||String(g).toUpperCase()):"";
function inches(x){return isNum(x.Depth)&&isNum(x.Bottom)?Math.floor((x.Bottom-x.Depth)*12+1e-6)+" inches":""}
function colorText(x){
  const c1=[x.Shade,x.ColorMod,x.Color1].filter(Boolean).join(" ");
  if(!c1&&!x.Color2)return"";
  if(x.Color2){const j=x.ColorConj==="-"?"-":" "+(x.ColorConj||"and")+" ";return (c1+j+x.Color2).toLowerCase()}
  return c1.toLowerCase();
}
function classText(x){
  const cls=(x.GroupName||NAMES[x.USCS]||"").toUpperCase();
  const mods=[x.ClassMod1,x.ClassMod2].filter(Boolean).join(" ");
  return [mods,cls].filter(Boolean).join(" ")+(x.USCS&&cls?" ("+x.USCS+")":"");
}
/* Log order: ORIGIN: color, moisture, consistency/density, modifiers, CLASSIFICATION, rock */
function describe(x){
  if(isSurface(x))return SURFACE[x.USCS].origin+(inches(x)?" ("+inches(x)+")":"");
  const parts=[colorText(x),(x.Moisture||"").toLowerCase(),(x.Consistency||x.Density||"").toLowerCase()];
  const mod=[x.ClassCon,x.Remarks1].filter(Boolean).join(" ");
  parts.push(mod,x.Remarks2||"",x.Remarks3||"",classText(x),x.Rock||"");
  let body=parts.filter(Boolean).join(", ");
  if(body)body=body.charAt(0).toUpperCase()+body.slice(1);
  const o=originText(x.Geology);
  return o?(body?o+": "+body:o):body;
}
function fam(x){
  if(typeof x==="object"&&(x.nAashto||x.nPave==="Yes"||x.nOrigin||x.nRock)){if(x.nPave==="Yes")return"pave";if(x.nRock||NC_ROCK.has(x.nOrigin))return"rock";const a=x.nAashto||"";return a.startsWith("A-1")?"grav":a.startsWith("A-2")||a==="A-3"?"sand":a==="A-4"||a==="A-5"?"silt":a?"clay":"none"}
  const u=typeof x==="string"?x:(x.USCS||"");
  if(typeof x==="object"&&!u){if(ROCKY.has(x.Geology))return"rock";if(FILLY.has(x.Geology))return"fill";return"none"}
  if(!u)return"none";if(u==="ASPHALT"||u==="CONCRETE"||u==="ABC")return"pave";if(u==="TOPSOIL"||u[0]==="O"||u==="PT")return"org";if(u[0]==="G")return"grav";if(u[0]==="S")return"sand";if(u[0]==="M"||u==="CL-ML")return"silt";return"clay"}
function suggestFromN(n,fine){
  if(!isNum(n))return"";
  if(fine)return n<2?"Very Soft":n<=4?"Soft":n<=8?"Medium Stiff":n<=15?"Stiff":n<=30?"Very Stiff":"Hard";
  return n<=4?"Very Loose":n<=10?"Loose":n<=30?"Medium Dense":n<=50?"Dense":"Very Dense";
}
function maxDepth(b){
  let m=isNum(b.HoleDepth)?b.HoleDepth:0;
  (b.samples||[]).forEach(s=>{m=Math.max(m,isNum(s.Bottom)?s.Bottom:s.Depth||0)});
  (b.strata||[]).forEach(s=>{m=Math.max(m,isNum(s.Bottom)?s.Bottom:s.Depth||0)});
  (b.core||[]).forEach(c=>{m=Math.max(m,runBottom(c))});
  return m;
}
/* ---------- rock core runs ---------- */
const runBottom=c=>(isNum(c.Depth)?c.Depth:0)+(isNum(c.Length)?c.Length:0);
const pctOf=(a,l)=>isNum(a)&&isNum(l)&&l>0?Math.round(a/l*100):"";
const coreOriginText=o=>!o?"":o==="Non-Crystalline"?"NON-CRYSTALLINE ROCK":o==="Crystalline"?"CRYSTALLINE ROCK":String(o).toUpperCase();
const isOtherCoreOrigin=v=>!!v&&!L.CoreOrigin.includes(v);
function coreColor(c){if(!c.Color1)return"";if(!c.Color2)return c.Color1;return c.Color1+(c.ColorConj==="-"?"-":" "+(c.ColorConj||"and")+" ")+c.Color2}
/* Origin carries down from the run above when left blank, like the lithology. */
function coreOrigins(b){let cur="";return byDepth(b.core||[]).map(c=>{if(c.Origin)cur=coreOriginText(c.Origin);return {c,origin:cur}})}
/* As printed on the coring log: "Red Severe Weathering to Moderate Weathering, Soft to Medium Hard, Moderately Close Fracture Spacing" */
function rangeText(a,b,j){return a&&b&&a!==b?a+" "+(j||"to")+" "+b:(a||b||"")}
function coreDescribe(c){
  if(c.nRunDesc||c.nHardA||c.nWeathA||c.nFracA||c.nCoreRock)return ncRunText(c);
  const w=rangeText(c.WeatheringHigh,c.WeatheringLow,c.Conjunction);
  const first=[coreColor(c),w].filter(Boolean).join(" ");
  const h=rangeText(c.HardnessSoftest,c.HardnessHardest,c.Conjunction);
  const f=rangeText(c.FracNarrowest,c.FracWidest,c.Conjunction);
  let d=[first,h,f?f+" Fracture Spacing":""].filter(Boolean).join(", ");
  if(c.Remarks)d+=(d?" ":"")+c.Remarks;
  return d;
}
/* Drill rate in ft/min, as on the log: run length / (time / 60). */
const drillRate=c=>isNum(c.Length)&&isNum(c.Time)&&c.Time>0?(Math.round(c.Length/(c.Time/60)*100)/100).toFixed(2):"";
function fmtSecs(t){return Math.max(0,Math.round(t))+" s"}
function nextPointID(pid){
  const ids=bors(pid).map(b=>String(b.PointID)); let max=0,pre="B-";
  ids.forEach(id=>{const m=id.match(/^(.*?)(\d+)$/);if(m){const n=+m[2];if(n>=max){max=n;pre=m[1]}}});
  return pre+(max+1);
}

/* ---------- form rendering ---------- */
function F(f,v){
  if(f.sec)return `<h3 class="sec">${esc(f.sec)}</h3>`;
  if(f.gps)return `<div class="fld"><button type="button" class="btn blue full" data-act="gps" id="gpsbtn">Use phone GPS</button><small id="gpsmsg">Fills East/North (NC State Plane), latitude, longitude and accuracy. Stand at the boring.</small></div>`;
  const id="f_"+f.k,lab=`<span class="lbl">${esc(f.l||f.k)}${f.u?` <i>${f.u}</i>`:""}${f.req?' <span class="req">required</span>':""}</span>`,hint=f.h?`<small>${f.h}</small>`:"",w=f.w||"";
  if(f.t==="chips"||f.t==="multi"){
    const vals=f.t==="multi"?String(v||"").split(", ").filter(Boolean):[v];
    return `<div class="fld ${w}" id="w_${f.k}">${lab}<div class="chips ${f.cls||""}" data-k="${f.k}" data-multi="${f.t==="multi"?1:0}" role="group">${f.o.map(o=>`<button type="button" class="chip${vals.includes(o)?" on":""}" data-v="${esc(o)}" aria-pressed="${vals.includes(o)}">${esc(o)}</button>`).join("")}</div>${hint}</div>`;
  }
  if(f.t==="select")return `<label class="fld ${w}" for="${id}">${lab}<select id="${id}" data-k="${f.k}"><option value=""></option>${f.o.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")}</select>${hint}</label>`;
  if(f.t==="fill")return `<div class="fld ${w}" id="w_${f.k}"><label class="lbl" for="${id}">${esc(f.l||f.k)}</label><input id="${id}" data-k="${f.k}" type="text" autocomplete="off" value="${esc(v)}"><div class="chips quick">${f.o.map(o=>`<button type="button" class="qchip" data-act="fill" data-t="${id}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>${hint}</div>`;
  if(f.t==="area")return `<label class="fld ${w}" for="${id}">${lab}<textarea id="${id}" data-k="${f.k}">${esc(v)}</textarea>${hint}</label>`;
  if(f.t==="num")return `<label class="fld ${w}" for="${id}">${lab}<input id="${id}" class="num" data-k="${f.k}" data-num="1" type="text" inputmode="${f.neg?"text":"decimal"}" autocomplete="off" value="${esc(v)}">${hint}</label>`;
  return `<label class="fld ${w}" for="${id}">${lab}<input id="${id}" data-k="${f.k}" type="${f.t||"text"}" ${f.list?`list="${f.list}"`:""} autocomplete="off" value="${esc(v)}">${hint}</label>`;
}
function form(specs,o){return `<div class="grid">${specs.map(f=>F(f,o[f.k]??"")).join("")}</div>`}
function readForm(root){
  const out={},bad=[];
  root.querySelectorAll("[data-k]").forEach(el=>{
    const k=el.dataset.k;
    if(el.classList.contains("chips")){const on=[...el.querySelectorAll(".chip.on")].map(b=>b.dataset.v);out[k]=el.dataset.multi==="1"?on.join(", "):(on[0]||"")}
    else if(el.dataset.num){const t=el.value.trim().replace(",",".");if(t===""){out[k]="";el.classList.remove("bad-in")}else{const n=Number(t);if(isFinite(n)){out[k]=n;el.classList.remove("bad-in")}else{out[k]="";bad.push(k);el.classList.add("bad-in")}}}
    else out[k]=el.value.trim();
  });
  return {out,bad};
}

/* ---------- daily activity logs ---------- */
const dailies=p=>(p.dailies||[]).slice().sort((a,b)=>String(b.Date).localeCompare(String(a.Date)));
const hm=t=>{const m=String(t||"").match(/^(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null};
function actHours(a){const s0=hm(a.Start),s1=hm(a.Stop);if(s0==null||s1==null)return null;let d=s1-s0;if(d<0)d+=1440;return Math.round(d/60*100)/100}
const dayHours=d=>(d.acts||[]).reduce((t,a)=>t+(actHours(a)||0),0);
const travelAuto=d=>Math.round((d.acts||[]).filter(a=>/drill crew travel/i.test(a.Activity||"")).reduce((t,a)=>t+(actHours(a)||0),0)*100)/100;
const sortedActs=d=>(d.acts||[]).slice().sort((a,b)=>{const x=hm(a.Start),y=hm(b.Start);return (x==null?1e9:x)-(y==null?1e9:y)});
function t12(t){const m=hm(t);if(m==null)return"";const h=Math.floor(m/60),mm=String(m%60).padStart(2,"0");return (h%12||12)+":"+mm+(h<12?" am":" pm")}
function usDate(v){const m=String(v||"").match(/^(\d{4})-(\d\d)-(\d\d)$/);return m?(+m[2])+"/"+(+m[3])+"/"+m[1]:"No date"}
function weekday(v){const m=String(v||"").match(/^(\d{4})-(\d\d)-(\d\d)$/);return m?["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(+m[1],+m[2]-1,+m[3]).getDay()]:""}
const ACT_PRESETS=["Drill Crew Travel to Site","Geo Travel to Site","Drill Prep","Drilling","Rock Coring","Pulling Steel / Clean Up","Setting Casing","Moving Rig","Water Haul","Standby","Drill Crew Travel from Site","Geo Travel from Site"];
const WEATHER=["Sunny","Partly Cloudy","Cloudy","Rain","Windy","Cold","Hot"];
/* All daily-log times are kept on 15-minute marks. */
function round15(t){const m=hm(t);if(m==null)return t||"";let r=Math.round(m/15)*15;if(r>=1440)r=1425;return String(Math.floor(r/60)).padStart(2,"0")+":"+String(r%60).padStart(2,"0")}
function nowHM(){const d=new Date();return round15(String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"))}

function strip(b){

  const coreCol=runs.map(c=>{const k=corig.get(c.id)||"cr";return `<i class="rock o-${k}${k==="wr"?" wrpat":""}" style="top:${pct(c.Depth)}%;height:${pct(runBottom(c))-pct(c.Depth)}%;background-color:var(--rock)" title="Core run"></i>`}).join("");

function validate(pid){
  const E=[],W=[],bs=bors(pid),seen={};
  bs.forEach(b=>{
    const id=b.PointID||"(no ID)";
    if(!b.PointID)E.push("A boring has no ID.");
    const k=String(b.PointID).toLowerCase(); if(seen[k])E.push(`Boring ID ${id} is used twice.`); seen[k]=1;
    if(!isNum(b.HoleDepth))W.push(`${id}: not closed out (no final depth).`);
    else if(b.HoleDepth<maxDepth(b))W.push(`${id}: final depth is shallower than logged entries.`);
    if(!isNum(b.Easting)||!isNum(b.Northing))W.push(`${id}: no East/North coordinates.`);
    if(!b.GW0Status)W.push(`${id}: no 0-hr groundwater entered.`);
    const st=byDepth(b.strata||[]);
    if(!st.length)W.push(`${id}: no soil layers described.`);
    else{ if(st[0].Depth>0)W.push(`${id}: layers start at ${fd(st[0].Depth)} ft, not 0.`);
      for(let i=1;i<st.length;i++)if(Math.abs(st[i].Depth-st[i-1].Bottom)>0.01)W.push(`${id}: gap or overlap at ${fd(st[i-1].Bottom)} ft.`);
      const coreBot=Math.max(0,...(b.core||[]).map(runBottom)),logBot=Math.max(st[st.length-1].Bottom,coreBot);
      if(isNum(b.HoleDepth)&&Math.abs(logBot-b.HoleDepth)>0.01)W.push(`${id}: layers${coreBot?" and core":""} end at ${fd(logBot)} ft but hole is ${fd(b.HoleDepth)} ft.`);}
    const cr=byDepth(b.core||[]);
    if(cr.length&&!b.CoreBit)W.push(`${id}: core runs but no bit entered.`);
    for(let i=1;i<cr.length;i++)if(Math.abs(cr[i].Depth-runBottom(cr[i-1]))>0.01)W.push(`${id}: gap between core runs at ${fd(runBottom(cr[i-1]))} ft.`);
    (b.samples||[]).forEach(s=>{if(s.SampleType==="SS"&&!blowsText(s))W.push(`${id} at ${fd(s.Depth)} ft: split spoon with no blow counts.`)});
  });
  if(!bs.length)E.push("This project has no borings to export.");
  return {E,W};
}

async function kmlText(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  if(!(buf[0]===0x50&&buf[1]===0x4B))return new TextDecoder().decode(buf);
  /* KMZ is a zip: find the first .kml entry through the central directory */
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);let eocd=-1;
  for(let i=buf.length-22;i>=Math.max(0,buf.length-65557);i--)if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)throw new Error("That KMZ file looks damaged.");

    if(method===0)return new TextDecoder().decode(data);
    if(method===8){

      const ds=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return await new Response(ds).text();
    }
    throw new Error("That KMZ uses a compression this app can't read. Save it as KML.");
  }

}
function kmlPoints(text){

  if(doc.getElementsByTagName("parsererror").length)throw new Error("That file isn't valid KML.");
  const out=[];

}

const SCAN_PROMPT=`You read handwritten geotechnical field forms for Falcon Engineering and return their contents as JSON for a logging app. A geologist will check every value against the paper, so give your best reading of each entry and list the names of any fields you are not sure of in that object's "unsure" array (for example ["blow2","moisture"]). Use "" for anything blank, crossed out, "NA", "N/A" or a dash. Do not invent values that are not written.

FORMS YOU WILL SEE
1. NCDOT "FIELD BORELOG (ENGLISH)" forms (half-sheet GEU-002e, usually two per page, or full-page GEU-003e). The same form is used on NCDOT projects (AASHTO classes such as A-4) and on commercial projects (USCS classes such as CL, SM, ML, SM-SC). One entry in "borings" per form, including forms that are started but have no samples logged.
   Header boxes: PROJECT NUMBER (WBS), ID (TIP), CO (county), GEO (geologist), BORING NUMBER, STA, OFFSET, ALIGNMENT, ELEVATION, TOTAL DEPTH, NORTH, EAST, DRILL MACHINE, DRILL EQMT NUMBER, DRILL METHOD (often "HSA / 2.25"" = method / auger size), START DATE, COMP DATE, SURFACE WTR DEPTH, DEPTH TO ROCK, HAMMER TYPE, DRILLER.
   GROUND WATER box: two columns, 0 HOUR and 24 HOUR; rows "Depth to WATER" (a depth or "dry"), "Depth to BTTM" (depth of the open hole, i.e. cave-in depth) and DATE. Put the 0 HOUR column in gw0Water/gw0Bottom/gw0Date and the 24 HOUR column in gw24Water/gw24Bottom/gw24Date.
   Grid: STRATUM FROM/TO, SAMPLE NUMBER/FROM/TO, DRIVE/SPT FROM/TO and three 0.5 ft blow columns, MOI (moisture), ORIGIN, SOIL & ROCK DESCRIPTION.
   Bottom line: "Boring terminated at __ ft IN/ON __" where IN or ON is circled. Handwritten notes below or beside the form go in "notes".
2. "DAILY ACTIVITIES LOG": header (PROJ NO (TIP), WBS, DESCRIPTION, WEATHER, DATE, DRILL RIG, GEOLOGIST, DRILLER, HELPER, OTHER PERSONNEL), rows of START, STOP, ACTIVITY, TOTAL TIME, travel rows with a Location, then SUBCONTRACTORS, DAILY SUMMARY (total footage SPT, core, casing) and CREW TIME SUMMARY (crew time, travel crew time). One entry in "dailies" per form.

FORMAT RULES
- Depths, elevations and coordinates: plain numbers without units or quote marks, e.g. "4.5", "408.25", "725359.44". Write ".4" as "0.4".
- Dates: YYYY-MM-DD. Two-digit years are 20xx ("11/04/26" -> "2026-11-04", "05 NOV 2026" -> "2026-11-05").
- Times: 24-hour "HH:MM" ("0745" -> "07:45", "1300" -> "13:00"). Times are often written 12-hour with no am/pm; use the order of the day to tell afternoon times ("1:15" after "11:30" -> "13:15", "4:30" travel home -> "16:30").
- Boring numbers: as written, upper case, no spaces, e.g. "L-12200LT", "B-3".
- Water readings: "dry" or a depth number.
- termInOn: "in" or "on", whichever is circled.
- refusal: "auger" when the form or its notes say auger refusal (e.g. "Auger Refusal @ 18'"), else "".
- topsoilIn: the inches in "Topsoil (3")" -> "3"; "Topsoil (0")" -> "0".

SAMPLES (one per SPT drive row)
- from/to: the DRIVE/SPT FROM and TO depths ("to" may be blank when there was no penetration, e.g. "50/0").
- number: the SAMPLE NUMBER written on the same row ("SS-" alone counts as "SS-"), else "".
- blow1 to blow4: the 0.5 ft blow columns in order. A partial increment is written blows/distance: "81/.4" -> "81/0.4", "50/0" -> "50/0". Leave later columns "" after a partial increment.
- moisture: D, M, W or Sat. (a lower-case m is M).
OTHER SAMPLES: samples in the SAMPLE NUMBER/FROM/TO columns that are not an SPT drive (bulk "BS-1007 0.5 5.3", core "CS-1007a 5.3 7.0", Shelby tube, bag). type: the letters before the dash (BS, CS, ST, GB) or the type as written. Notes like "Bulk (0.5-6.0')" also describe a sample.

STRATA (one per STRATUM FROM/TO pair)
- Do not make a stratum for a topsoil-only row (e.g. 0.0 to 0.3 marked Topsoil); report its inches in topsoilIn instead.
- The description is written on the sample rows; give each stratum the description of the samples whose depths fall inside it. If several samples in one stratum differ, combine them: colors in the order first seen, density as a range from the first to the last (density "VERY STIFF", densityTo "HARD"), modifiers listed once each.
- origin: "Residual" (Residual, Residuum, Resid.), "Alluvial" (Alluvial, Alluvium), "Fill", "Roadway Embankment", "PWR" (partially weathered rock), "WR" (weathered rock), "NCR" (non-crystalline rock), "CR" (crystalline rock), or the word as written.
- color: upper case, joined as "TAN AND ORANGE" or "BROWN GRAY AND TAN".
- density: upper case in full: VERY SOFT, SOFT, MEDIUM STIFF, STIFF, VERY STIFF, HARD, VERY LOOSE, LOOSE, MEDIUM DENSE, DENSE, VERY DENSE ("V." = VERY, "Med." = MEDIUM). densityTo only for a range ("stiff to v. stiff").
- soilName: upper case, the words before the class, e.g. "SANDY SILT", "SILTY CLAY", "ELASTIC SILT", "SANDY LEAN CLAY", "SILTY CLAYEY SAND".
- aashto: an AASHTO class in parentheses, e.g. "A-4", "A-2-4", "A-7" (write A-7-5 and A-7-6 as "A-7"). uscs: a USCS symbol in parentheses, e.g. "CL", "SM", "ML", "SM-SC". Fill whichever is written; the other is "".
- modifiers: upper case with "w/" written out: "WITH TRACE MANGANESE OXIDE", "WITH TRACE ROCK FRAGMENTS" ("frags" = FRAGMENTS); several joined with ", ".
- rock: for rock layers (PWR, WR, NCR, CR) the rock name, e.g. "META-ARGILLITE", "METAVOLCANIC ROCK"; colors still go in color ("Greenish gray" -> "GREENISH GRAY").
- A layer that is only topsoil, "(No Topsoil)" or "Topsoil (4 inches)": report the inches in topsoilIn ("" for no topsoil) and don't make a separate stratum; the next stratum keeps its written FROM depth.
- rawText: the description(s) exactly as written, several joined with " | ".

NOTES

DAILY LOG
- activities: one per row in time order. Keep the activity wording as written, fixing only obvious misspellings; write boring numbers in the boring format above. For printed travel rows use the printed label (e.g. "Drill Crew Travel to Site") and put the handwritten place in location as "Wise to Apex" (an arrow means "to"). writtenTotal: the TOTAL TIME as written, e.g. "0.50".
- waterReadings: any table of borings with water level (WL) and cave depth (CD) written beside the activities (usually 24-hour readings of earlier borings). One entry per boring. Do not copy these into activity text.
- subcontractors: one string per name.
- notes: anything else written on the form that has no field.

Return only data from the pages provided. If a page has no forms, return empty lists.`;

async function scanCall(cfg,pg){

  if(pg.pdf)content.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:pg.pdf}},{type:"text",text:`This is "${pg.label}". Read every form on every page.`});
  else{
    content.push({type:"text",text:pg.pieces.length>1?`"${pg.label}": the two pictures are the top and bottom halves of one page; they overlap a little, so don't count a row twice.`:`"${pg.label}": one page.`});
    pg.pieces.forEach(d=>content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:d}}));
    content.push({type:"text",text:"Read every form on this page."});
  }
  let res;
  try{res=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"application/json","X-App-Key":cfg.key||""},body:JSON.stringify({system:SCAN_PROMPT,content,schema:SCAN_SCHEMA,max_tokens:16000})})}
  catch(e){throw new Error("Couldn't reach the scan relay. Check the signal and the relay address.")}
  const txt=await res.text();let j;try{j=JSON.parse(txt)}catch(e){throw new Error(`The relay answered ${res.status}: ${txt.slice(0,140)}`)}
  if(!res.ok)throw new Error((j.error&&(j.error.message||j.error))||`The relay answered ${res.status}.`);
  if(j.stop_reason==="max_tokens")throw new Error("The answer was cut off. Scan this page by itself.");
  if(j.stop_reason==="refusal")throw new Error("Claude declined to read this page.");
  const tb=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
  let data;try{data=JSON.parse(tb.replace(/^\s*```(?:json)?\s*|\s*```\s*$/g,""))}catch(e){throw new Error("The answer wasn't readable data. Try again.")}
  return {data,usage:j.usage||{}};
}

async function poolRun(tasks,n){const out=new Array(tasks.length);let next=0;await Promise.all(Array.from({length:Math.min(n,tasks.length)},async()=>{while(next<tasks.length){const k=next++;out[k]=await tasks[k]()}}));return out}
async function scanRun(p){

      catch(e){errors.push(`${pg.label}: ${e.message}`);return null}finally{done++;say(`Claude has read ${done} of ${pages.length} page${pages.length===1?"":"s"}…`)}}),3);
    if(res.every(x=>!x))throw new Error(errors[0]||"Nothing came back.");
    const sc={pid:p.id,at:Date.now(),pages:pages.map(pg=>({label:pg.label,view:pg.view})),errors,usage,items:[]};

}

        b.strata=b.strata.filter(y=>!(a<y.Bottom-0.001&&z>y.Depth+0.001));
        if(nc)b.strata.push({id:uid(),Depth:a,Bottom:z,nOrigin:x.nOrigin,nColor:x.nColor,nDens:x.nDens,nDensTo:x.nDensTo,nName:x.nName,nAashto:x.nAashto,nMods:x.nMods,nRock:x.nRock,nPave:"",LayerLineType:"1",nGraphic:"Auto",nStepMode:"Auto",descEdited:false,coreEdited:false,USCS:"",Geology:""});
        else{const c=comLayer(it,x);b.strata.push(Object.assign(c,{id:uid(),Depth:a,Bottom:z,GraphLine100:"Yes"}))}});
      if(nc)ncOrigins(b).forEach(({x,origin})=>{if(!x.descEdited){x.nDesc=ncDescribe(x,origin);x.Description=x.nDesc}});
      else{let cur="";byDepth(b.strata).forEach(x=>{if(isSurface(x))return;if(x.Geology)cur=x.Geology;if(!x.descEdited){x.Description=describe(Object.assign({},x,{Geology:x.Geology||cur}))}})}
      it.notes.filter(x=>x.on&&x.Remark).forEach(x=>b.remarks.push({id:uid(),Depth:sn(x.Depth),Remark:x.Remark}));
      touch("b",b.id);nb++;
    }else{
      const date=scanDate(scanHeadVal(it,"Date"));if(!date)return;
      if(!p.dailies)p.dailies=[];
      let d=p.dailies.find(x=>x.Date===date);
      if(!d){d={id:uid(),Date:date,ProjNo:"",WBS:"",Description:"",Weather:"",DrillRig:"",Geologist:"",Driller:"",Helper:"",Other:"",Subs:"",Notes:"",acts:[]};p.dailies.push(d)}
      it.head.filter(h=>h.on).forEach(h=>{d[h.k]=h.k==="Date"?date:hv(h)});
      it.acts.filter(a=>a.on&&a.Activity).forEach(a=>{const s=round15(a.Start),e=round15(a.Stop);
        if((d.acts||[]).some(y=>y.Start===s&&y.Stop===e&&String(y.Activity).toLowerCase()===a.Activity.toLowerCase()))return;
        d.acts=(d.acts||[]).filter(y=>!(!y.Start&&!y.Stop&&String(y.Activity).toLowerCase()===a.Activity.toLowerCase()));
        d.acts.push({id:uid(),Start:s,Stop:e,Activity:a.Activity,Location:a.Location})});
      it.water.filter(w=>w.on).forEach(w=>{const b=bors(p.id).find(x=>normId(x.PointID)===normId(w.boring));if(!b)return;const r=scanWater(w.water);
        if(r.s){b.GW24Status=r.s;b.GW24Depth=r.d}if(isNum(sn(w.cave))){if(isNC(p))b.CaveDepth24=sn(w.cave);else b.CaveDepth=sn(w.cave)}b.DateGW=date;touch("b",b.id);nw++});
      touch("p",p.id);nd++;
    }
  });
  scanDraftClear();view={name:"project",pid:p.id,ptab:nb||!nd?"borings":"daily"};render();scrollTo(0,0);
  toast(`Saved ${[nb?nb+" boring"+(nb===1?"":"s"):"",nd?nd+" daily log"+(nd===1?"":"s"):"",nw?nw+" water reading"+(nw===1?"":"s"):""].filter(Boolean).join(", ")||"nothing"}`);
}

/* ---------- web app (when not running inside the Android app) ---------- */
const isStandalone=()=>(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function installHint(){
  if(NB||isStandalone())return"";
  if(window._installEvt)return `<div class="hint">Install Falcon Logs so it opens like an app and works offline. <button class="btn blue" style="margin-top:8px;width:100%" data-act="install">Install app</button></div>`;
  return `<div class="hint">${isIOS()?"To install on this iPhone or iPad: tap the <b>Share</b> button in Safari, then <b>Add to Home Screen</b>.":"To install: open the browser menu, then <b>Install app</b> or <b>Add to Home screen</b>."} Installed, it opens like an app and works with no signal.</div>`;
}
let wakeLock=null;
async function keepAwake(){try{if(navigator.wakeLock&&document.visibilityState==="visible")wakeLock=await navigator.wakeLock.request("screen")}catch(e){}}
function webBoot(){
  setInterval(()=>{document.querySelectorAll(".tbtn[data-start]").forEach(el=>{const t=el.querySelector(".tt");if(t)t.textContent=fmtSecs((Date.now()-Number(el.dataset.start))/1000)})},500);
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  keepAwake();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")keepAwake()});
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();window._installEvt=e;if(view.name==="home")render()});
  addEventListener("appinstalled",()=>{window._installEvt=null;if(view.name==="home")render();toast("Falcon Logs installed")});
  /* Phone back gesture closes forms and steps back through screens, like the Android app. */
  if(history.pushState){
    history.replaceState({fl:0},"");history.pushState({fl:1},"");
    addEventListener("popstate",()=>{if(window.appBack())history.pushState({fl:1},"");else history.back()});
  }
}

/* ---------- phone hooks (called from MainActivity) ---------- */
window.onLocation=(lat,lon,accM,stale)=>{
  window._gpsUsed=true;
  const set=(k,v)=>{const el=document.getElementById("f_"+k);if(el)el.value=v};
  set("Latitude",lat.toFixed(6));set("Longitude",lon.toFixed(6));if(accM>=0)set("GPS_Accuracy",Math.round(accM*3.28084));
  const sp=llToNC(lat,lon);set("Easting",sp.E.toFixed(2));set("Northing",sp.N.toFixed(2));
  const m=document.getElementById("gpsmsg"),btn=document.getElementById("gpsbtn");
  if(btn){btn.disabled=false;btn.textContent="Use phone GPS"}
  if(m)m.textContent=stale?"No fresh fix, so this is the phone's last known position. Check it.":accM>=0?`Fix to about ${Math.round(accM*3.28084)} ft.${accM*3.28084>15?" That's loose; wait a minute and try again for a better fix.":""}`:"Location filled in.";
};
window.onLocationError=msg=>{
  const m=document.getElementById("gpsmsg"),btn=document.getElementById("gpsbtn");
  if(btn){btn.disabled=false;btn.textContent="Use phone GPS"} if(m)m.textContent=msg; else toast(msg);
};
window.appBack=()=>{
  if(!sheet.hidden){closeSheet();return true}
  if(view.name==="boring"){view={name:"project",pid:S.borings[view.bid].pid};render();scrollTo(0,0);return true}
  if(view.name==="daily"){view={name:"project",pid:view.pid,ptab:"daily"};render();scrollTo(0,0);return true}
  if(view.name==="scan"){view={name:"project",pid:window._scan.pid};render();scrollTo(0,0);return true}
  if(view.name==="project"){view={name:"home"};render();scrollTo(0,0);return true}
  return false;
};

/* ---------- events ---------- */
let toastT=null;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
document.addEventListener("click",e=>{
  const chip=e.target.closest(".chip");
  if(chip){const g=chip.parentElement;if(g.dataset.multi!=="1"){const was=chip.classList.contains("on");g.querySelectorAll(".chip").forEach(c=>{c.classList.remove("on");c.setAttribute("aria-pressed","false")});if(!was){chip.classList.add("on");chip.setAttribute("aria-pressed","true")}}else{chip.classList.toggle("on");chip.setAttribute("aria-pressed",chip.classList.contains("on"))}if(cur&&cur.onInput)cur.onInput({target:g});return}
  if(e.target===sheet){closeSheet();return}
  const a=e.target.closest("[data-act]"); if(!a)return;
  const act=a.dataset.act,id=a.dataset.id,b=view.bid?S.borings[view.bid]:null;
  switch(act){
    case"home":view={name:"home"};render();break;
    case"openP":view={name:"project",pid:id};render();scrollTo(0,0);break;
    case"openB":view={name:"boring",bid:id,tab:"samples"};render();scrollTo(0,0);break;
    case"newP":projectSheet(null);break;
    case"editP":projectSheet(S.projects[view.pid]);break;
    case"newB":boringSheet(null);break;
    case"editB":boringSheet(b);break;
    case"close":closeoutSheet(b);break;
    case"tab":view.tab=a.dataset.t;render();break;
    case"newS":sampleSheet(b,null);break;
    case"editS":sampleSheet(b,b.samples.find(x=>x.id===id));break;
    case"newL":strataSheet(b,null);break;
    case"editL":strataSheet(b,b.strata.find(x=>x.id===id));break;
    case"editGW":gwSheet(b);break;
    case"addColor":{const inp=document.getElementById(a.dataset.t);if(inp){inp.value=addColor(inp.value,a.dataset.v);if(cur&&cur.onInput)cur.onInput({target:inp})}break}
    case"ncDescReset":if(window._ncReset)window._ncReset("d");break;
    case"ncCoreReset":if(window._ncReset)window._ncReset("c");break;
    case"ncRunReset":if(window._ncRunReset)window._ncRunReset();break;
    case"lapStart":if(window._ncFeet){b.lap={key:window._ncFeet.key,last:Date.now(),idx:0};touch("b",b.id);window._ncFeet.draw()}break;
    case"lapStop":delete b.lap;touch("b",b.id);if(window._ncFeet)window._ncFeet.draw();break;
    case"lapFoot":if(window._ncFeet&&b.lap){const F2=window._ncFeet;F2.read();const f=F2.get(),now=Date.now();
      if(b.lap.idx<f.length){f[b.lap.idx].t=Math.round((now-b.lap.last)/1000);b.lap.idx++;b.lap.last=now}
      if(b.lap.idx>=f.length)delete b.lap;touch("b",b.id);F2.set(f);F2.draw();if(cur&&cur.onInput)cur.onInput();}break;
    case"newC":coreSheet(b,null);break;
    case"editC":coreSheet(b,(b.core||[]).find(x=>x.id===id));break;
    case"editBit":bitSheet(b);break;
    case"timerStart":if(timerHolder){timerHolder.set(Date.now());touch("b",b.id);drawTimer(b);render()}break;
    case"timerReset":if(timerHolder){timerHolder.set(null);touch("b",b.id);drawTimer(b);render()}break;
    case"timerStop":if(timerHolder&&isNum(timerHolder.get())){const secs=Math.round((Date.now()-timerHolder.get())/1000);timerHolder.set(null);touch("b",b.id);const t=document.getElementById("f_Time");if(t){t.value=secs;if(cur&&cur.onInput)cur.onInput({target:t})}drawTimer(b);render();toast("Time "+fmtSecs(secs)+" filled in")}break;
    case"rowTimer":{const c=(b.core||[]).find(x=>x.id===id);if(!c)break;
      if(isNum(c.timerStart)){const secs=Math.round((Date.now()-c.timerStart)/1000);delete c.timerStart;c.Time=secs;touch("b",b.id);render();toast(`Run at ${fd(c.Depth)} ft: ${fmtSecs(secs)} recorded`)}
      else{c.timerStart=Date.now();touch("b",b.id);render();toast(`Timing run at ${fd(c.Depth)} ft`)}break}
    case"fill":{const inp=document.getElementById(a.dataset.t);if(inp){inp.value=a.dataset.v;if(cur&&cur.onInput)cur.onInput({target:inp})}break}
    case"newR":simpleSheet(b,"remarks",REM_F,null,"Drilling note",{Depth:maxDepth(b)||""},"Note");break;
    case"editR":simpleSheet(b,"remarks",REM_F,b.remarks.find(x=>x.id===id),"Drilling note",null,"Note");break;
    case"export":exportSheet();break;
    case"importKml":kmlSheet(S.projects[view.pid]);break;
    case"scan":scanSheet(S.projects[view.pid]);break;
    case"scanCfg":scanCfgSheet(()=>scanSheet(S.projects[view.pid]));break;
    case"scanTest":scanTest();break;
    case"scanRm":window._scanFiles.splice(+id,1);window._scanList&&window._scanList();break;
    case"scanPage":scanPage(+id);break;
    case"scanResume":{if(!window._scan||window._scan.pid!==view.pid){const d=scanDraftLoad();if(!d)break;window._scan=d}view={name:"scan",pid:window._scan.pid};render();scrollTo(0,0);break}
    case"scanBack":view={name:"project",pid:window._scan.pid};render();scrollTo(0,0);break;
    case"scanDiscard":confirmSheet("Discard scanned logs?","Nothing from this scan has been saved. Discarding removes the readings; you'd need to scan again.","Discard",()=>{const pid=window._scan.pid;scanDraftClear();closeSheet();view={name:"project",pid};render();toast("Scan discarded")});break;
    case"scanApply":scanApply();break;
    case"kmlApply":kmlApply();break;
    case"ptab":view.ptab=a.dataset.t;render();break;
    case"openPD":view={name:"project",pid:id,ptab:"daily"};render();scrollTo(0,0);break;
    case"openD":view={name:"daily",pid:view.pid,did:id};render();scrollTo(0,0);break;
    case"newD":dailyHeaderSheet(S.projects[view.pid],null);break;
    case"editD":{const p=S.projects[view.pid];dailyHeaderSheet(p,p.dailies.find(x=>x.id===view.did));break}
    case"newA":{const p=S.projects[view.pid];activitySheet(p,p.dailies.find(x=>x.id===view.did),null);break}
    case"editA":{const p=S.projects[view.pid],d=p.dailies.find(x=>x.id===view.did);activitySheet(p,d,d.acts.find(x=>x.id===id));break}
    case"editDS":{const p=S.projects[view.pid];daySummarySheet(p,p.dailies.find(x=>x.id===view.did));break}
    case"exportD":{const p=S.projects[view.pid];exportDaily(p,[p.dailies.find(x=>x.id===view.did)]);break}
    case"exportDailyAll":{const p=S.projects[view.pid];exportDaily(p,p.dailies||[]);break}
    case"nowT":{const inp=document.getElementById(a.dataset.t);if(inp){inp.value=nowHM();if(cur&&cur.onInput)cur.onInput({target:inp})}break}
    case"prepend":{const inp=document.getElementById(a.dataset.t);if(inp){const ids=bors(view.pid).map(b=>b.PointID);let v=inp.value;const hit=ids.find(i=>v.startsWith(i+" "));if(hit)v=v.slice(hit.length+1);inp.value=a.dataset.v+" "+v;if(cur&&cur.onInput)cur.onInput({target:inp})}break}
    case"backup":doBackup();break;
    case"restore":restoreSheet();break;
    case"share":if(NB)NB.shareLast(a.dataset.s||"");break;
    case"gps":if(NB){a.disabled=true;a.textContent="Getting a GPS fix…";const m=document.getElementById("gpsmsg");if(m)m.textContent="Hold the phone up with a clear view of the sky. This can take up to 45 seconds.";NB.getLocation()}else if(navigator.geolocation){a.disabled=true;a.textContent="Getting a GPS fix…";const m=document.getElementById("gpsmsg");if(m)m.textContent="Hold the phone up with a clear view of the sky. This can take up to 45 seconds.";
      navigator.geolocation.getCurrentPosition(p=>window.onLocation(p.coords.latitude,p.coords.longitude,isNum(p.coords.accuracy)?p.coords.accuracy:-1,false),
        e=>window.onLocationError(e.code===1?"Location is blocked for this app. On iPhone: Settings › Privacy & Security › Location Services › Safari Websites › While Using. On Android: tap the lock icon or app info and allow Location.":e.code===3?"No GPS fix yet. Move into the open and try again.":"Couldn't get a location. Turn on Location and try again."),
        {enableHighAccuracy:true,timeout:45000,maximumAge:0})}
      else{const m=document.getElementById("gpsmsg");if(m)m.textContent="This browser can't share its location. Type the coordinates here."}break;
    case"install":if(window._installEvt){window._installEvt.prompt();window._installEvt.userChoice.finally(()=>{window._installEvt=null;render()})}break;
    case"cancel":closeSheet();break;
    case"del":if(cur&&cur.del)cur.del();break;
    case"resetDesc":if(window._resetDesc)window._resetDesc();break;
    case"step":{const inp=document.getElementById("f_"+a.dataset.t);const v=Number(inp.value)||0;inp.value=Math.max(0,v+Number(a.dataset.d));if(cur&&cur.onInput)cur.onInput({target:inp});break}
  }
});
document.addEventListener("submit",e=>{e.preventDefault();if(cur&&cur.save)cur.save()});
document.addEventListener("input",e=>{if(cur&&cur.onInput&&panel.contains(e.target))cur.onInput(e)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)closeSheet()});

/* ---------- boot ---------- */
S=loadLocal(); if(!S){S=blank();seedExample()}
migrate();
render();
if(!NB)webBoot();
</script>
