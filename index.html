<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Falcon Logs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A2124" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Falcon Logs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: single phone column, sticky header, fixed bottom action bar, bottom-sheet forms; log strip as the signature element */
:root{
  --bg:#ECEFEA; --surface:#FFFFFF; --sunk:#F5F7F3; --ink:#16222A; --muted:#5A6870; --line:#D2D9D1;
  --accent:#D9480F; --accent-ink:#FFFFFF; --blue:#1C5A9C; --ok:#2B7A3D; --warn:#B26A00; --bad:#B42318;
  --grav:#C9A46A; --sand:#E9CF76; --silt:#B9BE8E; --clay:#8DA2B4; --org:#6E5843; --fill:#A7A7A1; --rock:#5C646B; --pave:#2F3336; --none:#E2E6E0;
  --display:"sans-serif-condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:Roboto,system-ui,sans-serif;
  --mono:"Roboto Mono","Droid Sans Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111618; --surface:#1A2124; --sunk:#151B1D; --ink:#E5ECE7; --muted:#95A39F; --line:#2D383B;
  --accent:#FF7A3D; --accent-ink:#1A0E06; --blue:#7DB2EA; --ok:#6CC383; --warn:#F2B44C; --bad:#FF8A80;
  --grav:#A88653; --sand:#C7AD57; --silt:#949A6C; --clay:#6F8597; --org:#7E6650; --fill:#7F807B; --rock:#4C545A; --pave:#0B0D0E; --none:#263033;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111618; --surface:#1A2124; --sunk:#151B1D; --ink:#E5ECE7; --muted:#95A39F; --line:#2D383B;
  --accent:#FF7A3D; --accent-ink:#1A0E06; --blue:#7DB2EA; --ok:#6CC383; --warn:#F2B44C; --bad:#FF8A80;
  --grav:#A88653; --sand:#C7AD57; --silt:#949A6C; --clay:#6F8597; --org:#7E6650; --fill:#7F807B; --rock:#4C545A; --pave:#0B0D0E; --none:#263033;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:56px}
.back{border:0;background:none;padding:6px 8px 6px 0;color:var(--blue);font-weight:600;cursor:pointer;white-space:nowrap}
.htitle{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}.pill.ex{color:var(--blue);border-color:currentColor}
main.wrap{padding-block:16px 120px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.meta{color:var(--muted);font-size:14px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.depth{font-family:var(--mono);font-weight:600;font-size:14px;min-width:86px;font-variant-numeric:tabular-nums}
.depth small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.sw{width:14px;align-self:stretch;border-radius:3px;flex:none}
.empty{padding:18px;color:var(--muted);text-align:center;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.blue{color:var(--blue);border-color:var(--blue)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.ghost{border-color:transparent;background:none;color:var(--blue)}
.btn.full{width:100%}
.btn:focus-visible,.chip:focus-visible,.row:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{flex:1 1 160px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{padding-top:10px;display:flex;gap:10px}
.bar .btn{flex:1}
/* boring summary */
.summary{display:grid;grid-template-columns:128px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.strip{position:relative;height:300px;margin-top:14px;display:grid;grid-template-columns:24px 32px 1fr;font-family:var(--mono);font-size:10px;color:var(--muted)}
.ticks,.col,.samps{position:relative}
.ticks span{position:absolute;right:4px;transform:translateY(-50%);font-variant-numeric:tabular-nums}
.col{border:1.5px solid var(--ink);background:var(--none);overflow:hidden}
.col i{position:absolute;left:0;right:0;border-bottom:1px solid var(--ink)}
.col i.fill{background-image:repeating-linear-gradient(45deg,var(--fill) 0 4px,transparent 4px 7px)}
.samps b{position:absolute;left:3px;width:8px;background:var(--ink);border-radius:1px}
.samps em{position:absolute;left:15px;transform:translateY(-50%);font-style:normal;font-family:var(--mono);font-weight:600;font-size:11px;line-height:1;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.samps em.ref{color:var(--accent)}
.samps b.run{background:repeating-linear-gradient(0deg,var(--ink) 0 2px,transparent 2px 5px);outline:1.5px solid var(--ink);outline-offset:-1.5px}
.samps em.rqd{color:var(--blue);font-size:10px}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.runrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.runrow:last-child{border-bottom:0}
.runrow .row{flex:1;min-width:0;border-bottom:0}
.tbtn{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-left:1px solid var(--line);background:var(--sunk);color:var(--blue);cursor:pointer;font-weight:600}
.tbtn .ti{font-size:16px;line-height:1}
.tbtn .tt{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}
.tbtn small{font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.tbtn.on{background:var(--accent);color:var(--accent-ink)}
.tbtn.on .tt{color:var(--accent-ink)}
.timer b{font-size:22px;color:var(--ink)}
.samps .ncap{position:absolute;left:15px;top:-15px;font-size:10px;letter-spacing:.06em;color:var(--muted)}
.wl{position:absolute;left:24px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--blue);transform:translateY(-100%)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;align-content:start;min-width:0}
.fact .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fact .v{font-family:var(--mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.facts .actions{grid-column:1/-1}
.tabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto}
.tab{flex:1 0 auto;font-size:15px;min-height:42px;border:0;border-radius:7px;background:none;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;padding:0 7px}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tab em{font-style:normal;font-family:var(--mono);font-size:11px;margin-left:3px;color:var(--muted)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,14,16,.5)}
.panel{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding-block:6px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 10px}
.phead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.phead h2{flex:1;font-size:24px}
.sec{margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:1/-1;min-width:0}
.fld.half{grid-column:auto}
.lbl{font-size:14px;font-weight:600}
.lbl i{font-style:normal;font-weight:500;color:var(--muted);font-family:var(--mono);font-size:12px}
.req{font-weight:600;font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.fld small{color:var(--muted);font-size:13px}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:10px 12px;font-size:16px}
input.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea{min-height:84px;resize:vertical}
.bad-in{border-color:var(--bad)!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-weight:500;cursor:pointer;font-size:15px}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.chips.quick{margin-top:2px}
.grid>.sec{grid-column:1/-1}
.qchip{min-height:34px;padding:0 10px;border-radius:8px;border:1px dashed var(--line);background:none;color:var(--blue);font-size:14px;cursor:pointer}
.chips.uscs .chip{font-family:var(--mono);font-size:13px;min-width:62px;padding:0 8px}
.blows{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stepper{display:flex;flex-direction:column;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.stepper .cap{font-size:11px;text-align:center;color:var(--muted);padding-top:4px;text-transform:uppercase;letter-spacing:.05em}
.stepper input{border:0;background:none;text-align:center;font-family:var(--mono);font-size:24px;font-weight:600;min-height:44px;padding:0}
.stepper .pm{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.stepper button{min-height:44px;border:0;background:var(--surface);font-size:22px;font-weight:600;cursor:pointer}
.stepper button+button{border-left:1px solid var(--line)}
.calc{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px;border-radius:8px;background:var(--sunk);font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.calc b{color:var(--accent)}
.hint{padding:10px 12px;border-left:3px solid var(--blue);background:var(--sunk);border-radius:0 8px 8px 0;font-size:14px}
.err{color:var(--bad);font-weight:600;font-size:14px}
.issues{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.issues li{padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:14px;border-left:3px solid var(--warn)}
.issues li.e{border-left-color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}
.note{color:var(--muted);font-size:13px}
.credit{margin:8px 0 0;text-align:center;color:var(--muted);font-size:13px;letter-spacing:.03em}
@media (max-width:380px){.summary{grid-template-columns:118px 1fr}.facts{grid-template-columns:1fr}.blows{gap:5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head><body>
<div id="app"></div>
<div id="sheet" class="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- picklists (values match the gINT import example) ---------- */
const L={
  SampleType:["SS","ST","CS","GB","AU","HQ","NQ","PQ","BULK","LS","DP"],
  DrillMethod:["Hollow Augers","Casing Advancer","Solid Stem Auger","Mud Rotary","Air Rotary","Sonic","Direct Push","Hand Auger","HQ Core","NQ Core","Test Pit"],
  HammerType:["Automatic","Safety (rope & cathead)","Donut","Wireline"],
  USCS:["GW","GP","GM","GC","GW-GM","GW-GC","GP-GM","GP-GC","SW","SP","SM","SC","SW-SM","SW-SC","SP-SM","SP-SC","SC-SM","ML","CL","CL-ML","OL","MH","CH","OH","PT","TOPSOIL","ABC","ASPHALT","CONCRETE"],
  Moisture:["Dry","Moist","Wet","Saturated"],
  Consistency:["Very Soft","Soft","Medium Stiff","Stiff","Very Stiff","Hard"],
  Density:["Very Loose","Loose","Medium Dense","Dense","Very Dense"],
  Shade:["Light","Dark"],
  ColorMod:["Reddish","Yellowish","Grayish","Mottled"],
  Color:["Brown","Black","Blue","Gray","Green","Multicolored","Orange","Olive","Pink","Purple","Red","Tan","White","Yellow","Red-Tan"],
  /* Rock core lookups (Falcon library: WEATHERING, HARDNESS, FRACTURE SPACING) */
  Weathering:["Fresh Rock","Very Slight Weathering","Slight Weathering","Moderate Weathering","Moderately Severe Weathering","Severe Weathering","Very Severe Weathering","Complete Weathering"],
  Hardness:["Very Hard","Hard","Moderately Hard","Medium Hard","Soft","Very Soft"],
  FracSpacing:["Very Wide","Wide","Moderately Close","Close","Very Close"],
  CoreOrigin:["Non-Crystalline","Crystalline","Other"],
  RockName:["Sandstone","Siltstone","Mudstone","Shale","Conglomerate","Siltstone Interbedded with Mudstone","Very Fine Grained Sandstone","Fine Grained Sandstone","Granite","Gneiss","Schist","Diabase","Metavolcanic Rock"],
  CoreConj:["to","and"],
  Bit:["HQ*","NQ*"],
  ColorConj:["and","-"],
  ClassMod:["Sandy","Silty","Clayey","Gravelly","Micaceous","Slightly"],
  ClassCon:["trace","with","little","some"],
  Remarks1:["Rock Fragments","Organics","Gravel","Roots","Mica","Quartz"],
  Rock:["Metavolcanic Rock","Metasedimentary Rock","Granite","Gneiss","Schist","Phyllite","Diabase"],
  PointType:["SPT","Hand Auger"],
  Termination:["Boring Terminated","Auger Refusal"],
  InOn:["in","on"],
  GW:["Dry","Water","Not checked"],
  LineType:["Blank","1"],
};
const LAB=["MC","LL/PL","-200","Gradation","Hydrometer","Proctor","CBR","UU","Consol","Organic","pH/Res"];
const ORIGIN=["Artificial Fill","Roadway Embankment","Alluvium","Residuum","PWR","WR","NCR","CR","Other"];
/* What each origin prints as in gINT's Origin / Term_Origin fields. */
const ORIGIN_OUT={"Artificial Fill":"FILL","PWR":"PARTIALLY WEATHERED ROCK","WR":"WEATHERED ROCK","NCR":"NON-CRYSTALLINE ROCK","CR":"CRYSTALLINE ROCK"};
const ROCKY=new Set(["PWR","WR","NCR","CR"]);
const FILLY=new Set(["Artificial Fill","Roadway Embankment"]);
/* Surface layers: their own origin text and graphic, thickness written in inches. */
const SURFACE={TOPSOIL:{origin:"TOPSOIL",graphic:"TOPSOIL"},ABC:{origin:"GRAVEL",graphic:"ABC"},ASPHALT:{origin:"ASPHALT",graphic:"ASPHALT"},CONCRETE:{origin:"CONCRETE",graphic:"CONCRETE"}};
const isOtherOrigin=v=>!!v&&!ORIGIN.includes(v);
function readOrigin(out){if(out.Geology==="Other")out.Geology=(out.OriginOther||"").trim()||"Other";delete out.OriginOther;return out}
const NAMES={GW:"Well-graded GRAVEL",GP:"Poorly graded GRAVEL",GM:"Silty GRAVEL",GC:"Clayey GRAVEL","GW-GM":"Well-graded GRAVEL with silt","GW-GC":"Well-graded GRAVEL with clay","GP-GM":"Poorly graded GRAVEL with silt","GP-GC":"Poorly graded GRAVEL with clay",SW:"Well-graded SAND",SP:"Poorly graded SAND",SM:"Silty SAND",SC:"Clayey SAND","SW-SM":"Well-graded SAND with silt","SW-SC":"Well-graded SAND with clay","SP-SM":"Poorly graded SAND with silt","SP-SC":"Poorly graded SAND with clay","SC-SM":"Silty, clayey SAND",ML:"SILT",CL:"Lean CLAY","CL-ML":"Silty CLAY",OL:"Organic SILT",MH:"Elastic SILT",CH:"Fat CLAY",OH:"Organic CLAY",PT:"PEAT"};
const FINE=new Set(["ML","CL","CL-ML","OL","MH","CH","OH","PT"]);
const CORE=new Set(["CS","HQ","NQ","PQ"]);

/* ---------- field specs ---------- */
const PROJ_F=[
 {k:"ProjectID",l:"Project number",req:1,h:"Exports as Number, e.g. G26002.00"},{k:"ProjectName",l:"Project name",req:1},
 {k:"Client",l:"Client"},{k:"Location",l:"Location",h:"City, state"},{k:"County",l:"County"}];
const BOR_F=[
 {sec:"Identification"},
 {k:"PointID",l:"Boring ID",req:1,h:"Must be unique in this project, e.g. B-1001"},
 {k:"PointType",l:"Type",t:"chips",o:L.PointType},
 {k:"DateStarted",l:"Date started",t:"date",w:"half"},{k:"DateCompleted",l:"Date completed",t:"date",w:"half"},
 {sec:"Location"},{gps:1},
 {k:"Easting",l:"East",u:"ft",t:"num",w:"half"},{k:"Northing",l:"North",u:"ft",t:"num",w:"half",h:"NC State Plane (NAD83, US ft). Filled from GPS."},
 {k:"Elevation",l:"Ground elev.",u:"ft",t:"num",w:"half",neg:1},{k:"GPS_Accuracy",l:"GPS accuracy",u:"ft",t:"num",w:"half"},
 {k:"Latitude",l:"Latitude",u:"deg",t:"num",w:"half",neg:1},{k:"Longitude",l:"Longitude",u:"deg",t:"num",w:"half",neg:1},
 {k:"Alignment",l:"Alignment",h:"Optional, e.g. 01 South"},
 {k:"Station",l:"Station",t:"num",w:"half"},{k:"Offset",l:"Offset",u:"ft",t:"num",w:"half",neg:1},
 {sec:"Crew"},
 {k:"LoggedBy",l:"Geologist",w:"half",h:"e.g. Goodnight, D."},{k:"Driller",l:"Driller",w:"half",h:"e.g. Rascot, R."},
 {k:"DrillingContractor",l:"Drilling contractor"},
 {sec:"Rig and hammer"},
 {k:"DrillRig",l:"Drill machine",h:"e.g. CME 55 Truck, Geoprobe"},
 {k:"DrillMethod",l:"Drill method",t:"select",o:L.DrillMethod},
 {k:"HammerType",l:"Hammer type",t:"chips",o:L.HammerType},
 {k:"BoreholeDiam_in",l:"Hole diameter",u:"in",t:"num",w:"half"},{k:"HammerEfficiency_pct",l:"Hammer ER",u:"%",t:"num",w:"half"},
 {k:"HammerWeight_lb",l:"Hammer weight",u:"lb",t:"num",w:"half"},{k:"HammerDrop_in",l:"Drop",u:"in",t:"num",w:"half"}];
const CLOSE_F=[
 {k:"HoleDepth",l:"Total depth",u:"ft",t:"num",req:1,w:"half"},{k:"DateCompleted",l:"Date completed",t:"date",w:"half"},
 {k:"Termination",l:"Termination",t:"chips",o:L.Termination},
 {k:"InOn",l:"In or on the bottom material",t:"chips",o:L.InOn,h:"Prints as e.g. Boring Terminated in RESIDUUM"},
 {k:"Backfill",l:"Backfill",h:"Not exported"},{k:"Weather",l:"Weather",h:"Not exported"},{k:"Remarks",l:"Boring remarks",t:"area",h:"Not exported"}];
const GW_F=[
 {sec:"At completion (0 hr)"},
 {k:"GW0Status",l:"Borehole",t:"chips",o:L.GW},{k:"GW0Depth",l:"Water depth",u:"ft",t:"num"},
 {sec:"24 hour reading"},
 {k:"GW24Status",l:"Borehole",t:"chips",o:L.GW},{k:"GW24Depth",l:"Water depth",u:"ft",t:"num"},
 {k:"DateGW",l:"Date of reading",t:"date"},
 {sec:"Cave-in"},
 {k:"CaveDepth",l:"Cave-in depth",u:"ft",t:"num",h:"Depth the hole caved to"}];
const REM_F=[{k:"Depth",l:"At depth",u:"ft",t:"num",req:1},{k:"Remark",l:"Note",t:"area",req:1,h:"Kept in the app; not part of the gINT export"}];

/* GPS (WGS84) to NC State Plane NAD83 US survey feet, EPSG:2264 (Lambert conformal conic). */
function llToNC(latDeg,lonDeg){
  const r=Math.PI/180,a=6378137,f=1/298.257222101,e=Math.sqrt(2*f-f*f),ft=1200/3937;
  const m=p=>Math.cos(p)/Math.sqrt(1-e*e*Math.sin(p)**2);
  const t=p=>Math.tan(Math.PI/4-p/2)/Math.pow((1-e*Math.sin(p))/(1+e*Math.sin(p)),e/2);
  const p1=(36+10/60)*r,p2=(34+20/60)*r,p0=33.75*r,p=latDeg*r;
  const n=(Math.log(m(p1))-Math.log(m(p2)))/(Math.log(t(p1))-Math.log(t(p2)));
  const F=m(p1)/(n*Math.pow(t(p1),n));
  const rho=a*F*Math.pow(t(p),n),rho0=a*F*Math.pow(t(p0),n),th=n*(lonDeg+79)*r;
  return {E:(609601.22+rho*Math.sin(th))/ft,N:(rho0-rho*Math.cos(th))/ft};
}

/* ---------- upgrade data saved by earlier versions ---------- */
function migrate(){
  Object.values(S.borings).forEach(b=>(b.strata||[]).forEach(x=>{if(x.Consistency){if(!x.Density)x.Density=x.Consistency;x.Consistency=""}}));
  const COLOR_SPLIT=c=>{
    const o={Shade:"",ColorMod:"",Color1:"",ColorConj:"",Color2:""};if(!c)return o;
    let w=String(c).trim();
    const sh=w.match(/^(Light|Dark)\s+/i);if(sh){o.Shade=sh[1][0].toUpperCase()+sh[1].slice(1).toLowerCase();w=w.slice(sh[0].length)}
    const md=w.match(/^(Reddish|Yellowish|Grayish|Mottled)\s+/i);if(md){o.ColorMod=md[1][0].toUpperCase()+md[1].slice(1).toLowerCase();w=w.slice(md[0].length)}
    o.Color1=w;return o;
  };
  Object.values(S.borings).forEach(b=>{
    if(b.deleted||b.v>=2)return;
    if(b.PointType==="Boring"||!b.PointType)b.PointType="SPT";
    if(b.DrillMethod==="Hollow Stem Auger")b.DrillMethod="Hollow Augers";
    (b.samples||[]).forEach(s=>{
      if(isNum(s.RefusalIn)&&!isNum(s.RefusalFt))s.RefusalFt=Math.round(s.RefusalIn/12*10)/10;
      delete s.RefusalIn;
      if(s.Moisture==null){const L2=layerAt(b,s.Depth);s.Moisture=L2&&L2.Moisture||""}
    });
    (b.strata||[]).forEach(x=>{
      if(x.Color!=null&&x.Color1==null){Object.assign(x,COLOR_SPLIT(x.Color));delete x.Color}
      if(x.Modifiers&&x.Remarks1==null){x.Remarks1=x.Modifiers}
      delete x.Modifiers;
      if(x.USCS==="FILL"){x.USCS="";if(/^fill$/i.test(x.GroupName||""))x.GroupName="";if(!x.Geology)x.Geology="Artificial Fill"}
      if(x.USCS==="ROCK"){x.USCS="";if(/^rock$/i.test(x.GroupName||""))x.GroupName=""}
      if(x.Geology==="FILL")x.Geology="Artificial Fill";
      if(!x.descEdited)x.Description=describe(x);
    });
    if(!b.GW0Status&&!b.GW24Status){
      const ws=b.water||[];
      const z=ws.find(w=>w.ReadingTiming==="At Completion")||ws.find(w=>w.ReadingTiming==="During Drilling");
      const d=ws.find(w=>w.ReadingTiming==="24 hr"||w.ReadingTiming==="Later Reading");
      if(z&&isNum(z.Depth)){b.GW0Status="Water";b.GW0Depth=z.Depth}
      if(d&&isNum(d.Depth)){b.GW24Status="Water";b.GW24Depth=d.Depth;b.DateGW=d.Date||""}
      const cv=ws.map(w=>w.CaveInDepth).filter(isNum);if(cv.length&&!isNum(b.CaveDepth))b.CaveDepth=Math.min(...cv);
    }
    if(!b.Termination)b.Termination="Boring Terminated";
    if(!b.InOn)b.InOn="in";
    b.v=2;
  });
}

const byDepth=a=>[...a].sort((x,y)=>(x.Depth||0)-(y.Depth||0));
/* Blow counts. Full 6-inch increments are numbers; a refusal (50 blows in less than 6 in)
   goes in the next slot as "50/0.3" (tenths of a foot), as in the gINT example. */
const hasRef=s=>isNum(s.RefusalFt);
function blowSlots(s){
  const full=[s.Blows1,s.Blows2,s.Blows3,s.Blows4];
  const out=[];for(const v of full){if(isNum(v))out.push(String(v));else break}
  if(hasRef(s)&&out.length<4)out.push("50/"+fmtFt(s.RefusalFt));
  while(out.length<4)out.push("");
  return out;
}
const fmtFt=v=>String(Math.round(v*10)/10);
function blowsText(s){return blowSlots(s).filter(Boolean).join("-")}
function refText(s){return hasRef(s)?"50/"+fmtFt(s.RefusalFt):""}
/* Penetration length in feet: 0.5 per full increment plus the refusal distance. */
function penFt(s){
  if(s.SampleType&&s.SampleType!=="SS")return isNum(s.Bottom)&&isNum(s.Depth)?Math.round((s.Bottom-s.Depth)*100)/100:"";
  const n=blowSlots(s).filter(v=>v&&v.indexOf("/")<0).length;
  if(!n&&!hasRef(s))return "";
  return Math.round((n*0.5+(hasRef(s)?s.RefusalFt:0))*100)/100;
}
function nVal(s){if(hasRef(s))return"";return isNum(s.Blows2)&&isNum(s.Blows3)?s.Blows2+s.Blows3:""}
/* What the log strip shows beside a sample: N, or the refusal text. */
function nLabel(s){if(s.SampleType&&s.SampleType!=="SS")return"";const n=nVal(s);return n!==""?String(n):refText(s)}
function recPct(s){return isNum(s.Recovery_in)&&isNum(s.DriveLength_in)&&s.DriveLength_in>0?Math.round(s.Recovery_in/s.DriveLength_in*100):""}
function layerAt(b,d){return byDepth(b.strata||[]).find(x=>isNum(x.Depth)&&d>=x.Depth&&(!isNum(x.Bottom)||d<x.Bottom))||null}
const isSurface=x=>!!SURFACE[x.USCS];
const originText=g=>g?(ORIGIN_OUT[g]||String(g).toUpperCase()):"";
function inches(x){return isNum(x.Depth)&&isNum(x.Bottom)?Math.floor((x.Bottom-x.Depth)*12+1e-6)+" inches":""}
function colorText(x){
  const c1=[x.Shade,x.ColorMod,x.Color1].filter(Boolean).join(" ");
  if(!c1&&!x.Color2)return"";
  if(x.Color2){const j=x.ColorConj==="-"?"-":" "+(x.ColorConj||"and")+" ";return (c1+j+x.Color2).toLowerCase()}
  return c1.toLowerCase();
}
function classText(x){
  const cls=(x.GroupName||NAMES[x.USCS]||"").toUpperCase();
  const mods=[x.ClassMod1,x.ClassMod2].filter(Boolean).join(" ");
  return [mods,cls].filter(Boolean).join(" ")+(x.USCS&&cls?" ("+x.USCS+")":"");
}
/* Log order: ORIGIN: color, moisture, consistency/density, modifiers, CLASSIFICATION, rock */
function describe(x){
  if(isSurface(x))return SURFACE[x.USCS].origin+(inches(x)?" ("+inches(x)+")":"");
  const parts=[colorText(x),(x.Moisture||"").toLowerCase(),(x.Consistency||x.Density||"").toLowerCase()];
  const mod=[x.ClassCon,x.Remarks1].filter(Boolean).join(" ");
  parts.push(mod,x.Remarks2||"",x.Remarks3||"",classText(x),x.Rock||"");
  let body=parts.filter(Boolean).join(", ");
  if(body)body=body.charAt(0).toUpperCase()+body.slice(1);
  const o=originText(x.Geology);
  return o?(body?o+": "+body:o):body;
}
function fam(x){
  const u=typeof x==="string"?x:(x.USCS||"");
  if(typeof x==="object"&&!u){if(ROCKY.has(x.Geology))return"rock";if(FILLY.has(x.Geology))return"fill";return"none"}
  if(!u)return"none";if(u==="ASPHALT"||u==="CONCRETE"||u==="ABC")return"pave";if(u==="TOPSOIL"||u[0]==="O"||u==="PT")return"org";if(u[0]==="G")return"grav";if(u[0]==="S")return"sand";if(u[0]==="M"||u==="CL-ML")return"silt";return"clay"}
function suggestFromN(n,fine){
  if(!isNum(n))return"";
  if(fine)return n<2?"Very Soft":n<=4?"Soft":n<=8?"Medium Stiff":n<=15?"Stiff":n<=30?"Very Stiff":"Hard";
  return n<=4?"Very Loose":n<=10?"Loose":n<=30?"Medium Dense":n<=50?"Dense":"Very Dense";
}
function maxDepth(b){
  let m=isNum(b.HoleDepth)?b.HoleDepth:0;
  (b.samples||[]).forEach(s=>{m=Math.max(m,isNum(s.Bottom)?s.Bottom:s.Depth||0)});
  (b.strata||[]).forEach(s=>{m=Math.max(m,isNum(s.Bottom)?s.Bottom:s.Depth||0)});
  (b.core||[]).forEach(c=>{m=Math.max(m,runBottom(c))});
  return m;
}
/* ---------- rock core runs ---------- */
const runBottom=c=>(isNum(c.Depth)?c.Depth:0)+(isNum(c.Length)?c.Length:0);
const pctOf=(a,l)=>isNum(a)&&isNum(l)&&l>0?Math.round(a/l*100):"";
const coreOriginText=o=>!o?"":o==="Non-Crystalline"?"NON-CRYSTALLINE":o==="Crystalline"?"CRYSTALLINE":String(o).toUpperCase();
const isOtherCoreOrigin=v=>!!v&&!L.CoreOrigin.includes(v);
function coreColor(c){if(!c.Color1)return"";if(!c.Color2)return c.Color1;return c.Color1+(c.ColorConj==="-"?"-":" "+(c.ColorConj||"and")+" ")+c.Color2}
/* Origin carries down from the run above when left blank, like the lithology. */
function coreOrigins(b){let cur="";return byDepth(b.core||[]).map(c=>{if(c.Origin)cur=coreOriginText(c.Origin);return {c,origin:cur}})}
/* As printed on the coring log: "Red Severe Weathering to Moderate Weathering, Soft to Medium Hard, Moderately Close Fracture Spacing" */
function rangeText(a,b,j){return a&&b&&a!==b?a+" "+(j||"to")+" "+b:(a||b||"")}
function coreDescribe(c){
  const w=rangeText(c.WeatheringHigh,c.WeatheringLow,c.Conjunction);
  const first=[coreColor(c),w].filter(Boolean).join(" ");
  const h=rangeText(c.HardnessSoftest,c.HardnessHardest,c.Conjunction);
  const f=rangeText(c.FracNarrowest,c.FracWidest,c.Conjunction);
  let d=[first,h,f?f+" Fracture Spacing":""].filter(Boolean).join(", ");
  if(c.Remarks)d+=(d?" ":"")+c.Remarks;
  return d;
}
/* Drill rate in ft/min, as on the log: run length / (time / 60). */
const drillRate=c=>isNum(c.Length)&&isNum(c.Time)&&c.Time>0?(Math.round(c.Length/(c.Time/60)*100)/100).toFixed(2):"";
function fmtSecs(t){return Math.max(0,Math.round(t))+" s"}
function nextPointID(pid){
  const ids=bors(pid).map(b=>String(b.PointID)); let max=0,pre="B-";
  ids.forEach(id=>{const m=id.match(/^(.*?)(\d+)$/);if(m){const n=+m[2];if(n>=max){max=n;pre=m[1]}}});
  return pre+(max+1);
}

function F(f,v){

  if(f.gps)return `<div class="fld"><button type="button" class="btn blue full" data-act="gps" id="gpsbtn">Use phone GPS</button><small id="gpsmsg">Fills East/North (NC State Plane), latitude, longitude and accuracy. Stand at the boring.</small></div>`;
  const id="f_"+f.k,lab=`<span class="lbl">${esc(f.l||f.k)}${f.u?` <i>${f.u}</i>`:""}${f.req?' <span class="req">required</span>':""}</span>`,hint=f.h?`<small>${f.h}</small>`:"",w=f.w||"";
  if(f.t==="chips"||f.t==="multi"){
    const vals=f.t==="multi"?String(v||"").split(", ").filter(Boolean):[v];
    return `<div class="fld ${w}" id="w_${f.k}">${lab}<div class="chips ${f.cls||""}" data-k="${f.k}" data-multi="${f.t==="multi"?1:0}" role="group">${f.o.map(o=>`<button type="button" class="chip${vals.includes(o)?" on":""}" data-v="${esc(o)}" aria-pressed="${vals.includes(o)}">${esc(o)}</button>`).join("")}</div>${hint}</div>`;
  }
  if(f.t==="select")return `<label class="fld ${w}" for="${id}">${lab}<select id="${id}" data-k="${f.k}"><option value=""></option>${f.o.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")}</select>${hint}</label>`;
  if(f.t==="fill")return `<div class="fld ${w}" id="w_${f.k}"><label class="lbl" for="${id}">${esc(f.l||f.k)}</label><input id="${id}" data-k="${f.k}" type="text" autocomplete="off" value="${esc(v)}"><div class="chips quick">${f.o.map(o=>`<button type="button" class="qchip" data-act="fill" data-t="${id}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>${hint}</div>`;
  if(f.t==="area")return `<label class="fld ${w}" for="${id}">${lab}<textarea id="${id}" data-k="${f.k}">${esc(v)}</textarea>${hint}</label>`;
  if(f.t==="num")return `<label class="fld ${w}" for="${id}">${lab}<input id="${id}" class="num" data-k="${f.k}" data-num="1" type="text" inputmode="${f.neg?"text":"decimal"}" autocomplete="off" value="${esc(v)}">${hint}</label>`;
  return `<label class="fld ${w}" for="${id}">${lab}<input id="${id}" data-k="${f.k}" type="${f.t||"text"}" ${f.list?`list="${f.list}"`:""} autocomplete="off" value="${esc(v)}">${hint}</label>`;
}
function form(specs,o){return `<div class="grid">${specs.map(f=>F(f,o[f.k]??"")).join("")}</div>`}
function readForm(root){
  const out={},bad=[];
  root.querySelectorAll("[data-k]").forEach(el=>{
    const k=el.dataset.k;
    if(el.classList.contains("chips")){const on=[...el.querySelectorAll(".chip.on")].map(b=>b.dataset.v);out[k]=el.dataset.multi==="1"?on.join(", "):(on[0]||"")}
    else if(el.dataset.num){const t=el.value.trim().replace(",",".");if(t===""){out[k]="";el.classList.remove("bad-in")}else{const n=Number(t);if(isFinite(n)){out[k]=n;el.classList.remove("bad-in")}else{out[k]="";bad.push(k);el.classList.add("bad-in")}}}
    else out[k]=el.value.trim();
  });
  return {out,bad};
}

function strip(b){
  const md=Math.max(5,Math.ceil(maxDepth(b)/5)*5),pct=d=>Math.min(100,Math.max(0,d/md*100)),H=300;
  const step=md>40?10:5; let ticks="";for(let d=0;d<=md;d+=step)ticks+=`<span style="top:${pct(d)}%">${d}</span>`;
  const bands=byDepth(b.strata||[]).map(s=>{const bot=isNum(s.Bottom)?s.Bottom:s.Depth,f=fam(s);return `<i class="${f}" style="top:${pct(s.Depth)}%;height:${pct(bot)-pct(s.Depth)}%;background-color:var(--${f})" title="${esc(s.USCS||s.Geology||"")}"></i>`}).join("");
  const ss=byDepth(b.samples||[]);
  const samps=ss.map(s=>{const bot=isNum(s.Bottom)?s.Bottom:s.Depth+(isNum(penFt(s))?penFt(s):1.5);return `<b style="top:${pct(s.Depth)}%;height:${Math.max(1.5,pct(bot)-pct(s.Depth))}%"></b>`}).join("");
  /* N labels at each sample's mid-depth; skip one that would overlap the label above it. */
  let lastY=-99,labels="";
  ss.forEach(s=>{const t=nLabel(s);if(!t)return;const bot=isNum(s.Bottom)?s.Bottom:s.Depth+1.5,y=pct((s.Depth+bot)/2)*H/100;
    if(y-lastY<11)return;lastY=y;labels+=`<em class="${hasRef(s)?"ref":""}" style="top:${y}px">${esc(t)}</em>`});
  const runs=byDepth(b.core||[]);
  const coreCol=runs.map(c=>`<i class="rock" style="top:${pct(c.Depth)}%;height:${pct(runBottom(c))-pct(c.Depth)}%;background-color:var(--rock)" title="Core run"></i>`).join("");
  const coreBars=runs.map(c=>`<b class="run" style="top:${pct(c.Depth)}%;height:${Math.max(1.5,pct(runBottom(c))-pct(c.Depth))}%"></b>`).join("");
  runs.forEach(c=>{const q=pctOf(c.RQD_Length,c.Length);if(q==="")return;const y=pct(c.Depth+(c.Length||0)/2)*H/100;
    if(y-lastY<11)return;lastY=y;labels+=`<em class="rqd" style="top:${y}px">RQD ${q}</em>`});
  const wd=b.GW0Status==="Water"&&isNum(b.GW0Depth)?b.GW0Depth:b.GW24Status==="Water"&&isNum(b.GW24Depth)?b.GW24Depth:null;
  const w=wd!=null?`<span class="wl" style="top:${pct(wd)}%" title="Water ${wd} ft"></span>`:"";
  return `<div class="strip" aria-label="Log strip to ${md} ft with N-values"><div class="ticks">${ticks}</div><div class="col">${bands}${coreCol}</div><div class="samps">${samps}${coreBars}${w}<span class="ncap">N</span>${labels}</div></div>`;
}

    cta=`<button class="btn pri" data-act="newR">Add drilling note</button>`;

  const emptyMsg={samples:"No samples yet.",strata:"No layers described yet.",core:"No core runs yet.",water:"No water readings. Add one if you hit water or at completion.",notes:"No drilling notes."}[tab];

/* ---------- validation & export ---------- */
function validate(pid){
  const E=[],W=[],bs=bors(pid),seen={};
  bs.forEach(b=>{
    const id=b.PointID||"(no ID)";
    if(!b.PointID)E.push("A boring has no ID.");
    const k=String(b.PointID).toLowerCase(); if(seen[k])E.push(`Boring ID ${id} is used twice.`); seen[k]=1;
    if(!isNum(b.HoleDepth))W.push(`${id}: not closed out (no final depth).`);
    else if(b.HoleDepth<maxDepth(b))W.push(`${id}: final depth is shallower than logged entries.`);
    if(!isNum(b.Easting)||!isNum(b.Northing))W.push(`${id}: no East/North coordinates.`);
    if(!b.GW0Status)W.push(`${id}: no 0-hr groundwater entered.`);
    const st=byDepth(b.strata||[]);
    if(!st.length)W.push(`${id}: no soil layers described.`);
    else{ if(st[0].Depth>0)W.push(`${id}: layers start at ${fd(st[0].Depth)} ft, not 0.`);
      for(let i=1;i<st.length;i++)if(Math.abs(st[i].Depth-st[i-1].Bottom)>0.01)W.push(`${id}: gap or overlap at ${fd(st[i-1].Bottom)} ft.`);
      const coreBot=Math.max(0,...(b.core||[]).map(runBottom)),logBot=Math.max(st[st.length-1].Bottom,coreBot);
      if(isNum(b.HoleDepth)&&Math.abs(logBot-b.HoleDepth)>0.01)W.push(`${id}: layers${coreBot?" and core":""} end at ${fd(logBot)} ft but hole is ${fd(b.HoleDepth)} ft.`);}
    const cr=byDepth(b.core||[]);

  Object.values(S.borings).forEach(b=>{if(!b.deleted&&live.projects[b.pid])live.borings[b.id]=b});
  const n=Object.keys(live.projects).length;

  const name=`FalconLogs-backup-${today()}.json`;
  const data=new TextEncoder().encode(JSON.stringify({app:"FalconLogs",version:1,saved:new Date().toISOString(),...live}));

  const m=document.getElementById("gpsmsg"),btn=document.getElementById("gpsbtn");
  if(btn){btn.disabled=false;btn.textContent="Use phone GPS"}
  if(m)m.textContent=stale?"No fresh fix, so this is the phone's last known position. Check it.":accM>=0?`Fix to about ${Math.round(accM*3.28084)} ft.${accM*3.28084>15?" That's loose; wait a minute and try again for a better fix.":""}`:"Location filled in.";
};
window.onLocationError=msg=>{
  const m=document.getElementById("gpsmsg"),btn=document.getElementById("gpsbtn");
  if(btn){btn.disabled=false;btn.textContent="Use phone GPS"} if(m)m.textContent=msg; else toast(msg);
};
window.appBack=()=>{
  if(!sheet.hidden){closeSheet();return true}
  if(view.name==="boring"){view={name:"project",pid:S.borings[view.bid].pid};render();scrollTo(0,0);return true}
  if(view.name==="project"){view={name:"home"};render();scrollTo(0,0);return true}
  return false;
};

/* ---------- events ---------- */
let toastT=null;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
document.addEventListener("click",e=>{
  const chip=e.target.closest(".chip");
  if(chip){const g=chip.parentElement;if(g.dataset.multi!=="1"){const was=chip.classList.contains("on");g.querySelectorAll(".chip").forEach(c=>{c.classList.remove("on");c.setAttribute("aria-pressed","false")});if(!was){chip.classList.add("on");chip.setAttribute("aria-pressed","true")}}else{chip.classList.toggle("on");chip.setAttribute("aria-pressed",chip.classList.contains("on"))}if(cur&&cur.onInput)cur.onInput({target:g});return}
  if(e.target===sheet){closeSheet();return}
  const a=e.target.closest("[data-act]"); if(!a)return;
  const act=a.dataset.act,id=a.dataset.id,b=view.bid?S.borings[view.bid]:null;
  switch(act){
    case"home":view={name:"home"};render();break;
    case"openP":view={name:"project",pid:id};render();scrollTo(0,0);break;
    case"openB":view={name:"boring",bid:id,tab:"samples"};render();scrollTo(0,0);break;
    case"newP":projectSheet(null);break;
    case"editP":projectSheet(S.projects[view.pid]);break;
    case"newB":boringSheet(null);break;
    case"editB":boringSheet(b);break;
    case"close":closeoutSheet(b);break;
    case"tab":view.tab=a.dataset.t;render();break;
    case"newS":sampleSheet(b,null);break;
    case"editS":sampleSheet(b,b.samples.find(x=>x.id===id));break;
    case"newL":strataSheet(b,null);break;
    case"editL":strataSheet(b,b.strata.find(x=>x.id===id));break;
    case"editGW":gwSheet(b);break;
    case"newC":coreSheet(b,null);break;
    case"editC":coreSheet(b,(b.core||[]).find(x=>x.id===id));break;
    case"editBit":bitSheet(b);break;
    case"timerStart":if(timerHolder){timerHolder.set(Date.now());touch("b",b.id);drawTimer(b);render()}break;
    case"timerReset":if(timerHolder){timerHolder.set(null);touch("b",b.id);drawTimer(b);render()}break;
    case"timerStop":if(timerHolder&&isNum(timerHolder.get())){const secs=Math.round((Date.now()-timerHolder.get())/1000);timerHolder.set(null);touch("b",b.id);const t=document.getElementById("f_Time");if(t){t.value=secs;if(cur&&cur.onInput)cur.onInput({target:t})}drawTimer(b);render();toast("Time "+fmtSecs(secs)+" filled in")}break;
    case"rowTimer":{const c=(b.core||[]).find(x=>x.id===id);if(!c)break;
      if(isNum(c.timerStart)){const secs=Math.round((Date.now()-c.timerStart)/1000);delete c.timerStart;c.Time=secs;touch("b",b.id);render();toast(`Run at ${fd(c.Depth)} ft: ${fmtSecs(secs)} recorded`)}
      else{c.timerStart=Date.now();touch("b",b.id);render();toast(`Timing run at ${fd(c.Depth)} ft`)}break}
    case"fill":{const inp=document.getElementById(a.dataset.t);if(inp){inp.value=a.dataset.v;if(cur&&cur.onInput)cur.onInput({target:inp})}break}
    case"newR":simpleSheet(b,"remarks",REM_F,null,"Drilling note",{Depth:maxDepth(b)||""},"Note");break;
    case"editR":simpleSheet(b,"remarks",REM_F,b.remarks.find(x=>x.id===id),"Drilling note",null,"Note");break;
    case"export":exportSheet();break;
    case"backup":doBackup();break;
    case"restore":restoreSheet();break;
    case"share":if(NB)NB.shareLast(a.dataset.s||"");break;
    case"gps":if(NB){a.disabled=true;a.textContent="Getting a GPS fix…";const m=document.getElementById("gpsmsg");if(m)m.textContent="Hold the phone up with a clear view of the sky. This can take up to 45 seconds.";NB.getLocation()}else if(navigator.geolocation){a.disabled=true;a.textContent="Getting a GPS fix…";const m=document.getElementById("gpsmsg");if(m)m.textContent="Hold the phone up with a clear view of the sky. This can take up to 45 seconds.";
      navigator.geolocation.getCurrentPosition(p=>window.onLocation(p.coords.latitude,p.coords.longitude,isNum(p.coords.accuracy)?p.coords.accuracy:-1,false),
        e=>window.onLocationError(e.code===1?"Location is blocked for this app. On iPhone: Settings › Privacy & Security › Location Services › Safari Websites › While Using. On Android: tap the lock icon or app info and allow Location.":e.code===3?"No GPS fix yet. Move into the open and try again.":"Couldn't get a location. Turn on Location and try again."),
        {enableHighAccuracy:true,timeout:45000,maximumAge:0})}
      else{const m=document.getElementById("gpsmsg");if(m)m.textContent="This browser can't share its location. Type the coordinates here."}break;
    case"install":if(window._installEvt){window._installEvt.prompt();window._installEvt.userChoice.finally(()=>{window._installEvt=null;render()})}break;
    case"cancel":closeSheet();break;
    case"del":if(cur&&cur.del)cur.del();break;
    case"resetDesc":if(window._resetDesc)window._resetDesc();break;
    case"step":{const inp=document.getElementById("f_"+a.dataset.t);const v=Number(inp.value)||0;inp.value=Math.max(0,v+Number(a.dataset.d));if(cur&&cur.onInput)cur.onInput({target:inp});break}
  }
});
document.addEventListener("submit",e=>{e.preventDefault();if(cur&&cur.save)cur.save()});
document.addEventListener("input",e=>{if(cur&&cur.onInput&&panel.contains(e.target))cur.onInput(e)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)closeSheet()});

/* ---------- boot ---------- */
S=loadLocal(); if(!S){S=blank();seedExample()}
migrate();
render();
if(!NB)webBoot();
</script>
</body></html>
